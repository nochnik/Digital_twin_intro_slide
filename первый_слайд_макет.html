<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что такое ЦД Актива КМГ · первый слайд (макет)</title>
<style>
:root{
  --cyan:#4FE3FF; --amber:#F0AE4A; --blue:#8FBAF0; --teal:#35D0C2; --viol:#9B7BE8;
  --bg0:#050810; --bg1:#0C1626; --line:rgba(140,170,210,.22);
  --glass:rgba(10,18,32,.82); --txt:#D7E2F2; --dim:#7C8DA6;
  --mono:Consolas,"Courier New",monospace; --serif:Cambria,Georgia,serif;
  --ui:"Segoe UI",Calibri,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--ui);color:var(--txt);
  background:radial-gradient(ellipse at 50% 30%,#0C1626 0%,#050810 70%)}
#scene{position:fixed;inset:0}

/* ---- шапка ---- */
#hdr{position:fixed;top:22px;left:26px;z-index:10;pointer-events:none}
#hdr h1{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2}
#hdr .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-top:6px}
#hdr .sub b{color:var(--cyan);font-weight:700}

/* ---- слои: кнопки снизу вверх ---- */
#stack{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px;width:250px}
.lay{cursor:pointer;text-align:left;background:var(--glass);border:1px solid var(--line);
  border-left:3px solid var(--lc);padding:10px 12px;color:var(--txt);font-family:var(--ui);
  transition:background .2s,border-color .2s,transform .2s;backdrop-filter:blur(8px)}
.lay .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim)}
.lay .t{font-size:13.5px;font-weight:600;margin-top:2px}
.lay:hover,.lay.hot{background:rgba(79,227,255,.08);border-color:var(--lc);transform:translateX(4px)}
.lay.hot .n{color:var(--lc)}
.lay .tag{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--dim);
  border:1px solid var(--line);padding:1px 5px;margin-top:4px;text-transform:uppercase}

/* ---- информационное окно ---- */
#panel{position:fixed;right:26px;top:50%;transform:translateY(-50%) translateX(30px);z-index:10;width:400px;
  max-height:84vh;overflow-y:auto;background:var(--glass);border:1px solid var(--line);
  border-top:2px solid var(--pc,#4FE3FF);backdrop-filter:blur(12px);padding:20px 22px;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#panel.vis{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
#panel::-webkit-scrollbar{width:5px}
#panel::-webkit-scrollbar-thumb{background:rgba(140,170,210,.3)}
#p-kick{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--pc,#4FE3FF)}
#p-name{font-family:var(--serif);font-size:23px;font-weight:600;margin-top:5px;line-height:1.2}
#p-claim{font-size:13.5px;color:var(--dim);margin-top:8px;line-height:1.5}
.p-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  margin:16px 0 7px;border-bottom:1px solid var(--line);padding-bottom:5px}
#p-fx{display:flex;flex-wrap:wrap;gap:6px}
.fx{border:1px solid var(--pc,#4FE3FF);padding:6px 10px;min-width:86px}
.fx .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--pc,#4FE3FF)}
.fx .l{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.3}
#p-blocks .bl{margin-bottom:9px}
#p-blocks .bt{font-size:12.5px;font-weight:600}
#p-blocks .bi{font-size:11.5px;color:var(--dim);line-height:1.5}
#p-mods{display:flex;flex-wrap:wrap;gap:5px}
.mod{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);color:var(--txt);padding:3px 8px}
#p-note{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.5;border-left:2px solid var(--pc,#4FE3FF);padding-left:9px}
#p-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);
  font-size:18px;cursor:pointer;line-height:1}
#p-close:hover{color:var(--txt)}

/* ---- дорожная карта ---- */
#road{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:0;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 22px}
.rd{text-align:center;padding:0 18px}
.rd .y{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--cyan)}
.rd .d{font-size:10.5px;color:var(--dim);margin-top:2px;white-space:nowrap}
.rsep{width:34px;height:1px;background:var(--line);position:relative}
.rsep::after{content:'';position:absolute;right:0;top:-2.5px;border-left:5px solid var(--line);
  border-top:3px solid transparent;border-bottom:3px solid transparent}

#hint{position:fixed;bottom:24px;left:26px;z-index:10;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* ---- чип у курсора ---- */
#chip{position:fixed;z-index:20;pointer-events:none;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:#EAF2FF;background:rgba(8,14,26,.9);
  border:1px solid var(--cc,#4FE3FF);border-left:3px solid var(--cc,#4FE3FF);padding:4px 9px;display:none;white-space:nowrap}

@media (max-width:1100px){ #stack{width:200px} #panel{width:340px} }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   ДАННЫЕ: 4 контура ЦД (источники: сценарий демо, слайд 7 АТК,
   upstreamData коллеги; именование — только ABAI, без вендоров)
   ================================================================ */
const ZONES = {
  grr: {
    no:'01', name:'ЦД ресурсной базы', short:'ГРР · ресурсная база', color:'#9B7BE8',
    claim:'Цифровая геологическая модель: восполняемость и конверсия запасов. Сейсморазведка, интерпретация и геологическое моделирование в едином контуре.',
    fx:[{v:'−15%', l:'полный цикл ГРР'}],
    blocks:[
      {t:'Интерпретация и геологическое моделирование', i:'Сейсморазведка и обработка данных · построение геологических моделей'}
    ],
    mods:['Геомодели (КМГИ)','ГГДМ'],
    note:'Контур 2027 года — вне периметра пилота Молдабек Восточный. Показывается как целевой образ.'
  },
  plast: {
    no:'02', name:'ЦД пласта', short:'Пласт', color:'#F0AE4A',
    claim:'Постоянно действующая гидродинамическая модель и приоритизация мероприятий по экономике: планирование не от пробуренных скважин, а от ограничений пласта и геологии.',
    fx:[{v:'−5%', l:'снижение CAPEX'}],
    blocks:[
      {t:'Геолого-гидродинамическая модель', i:'Построение и адаптация ГГДМ · модели характеристик вытеснения и Кпрод по скважине'},
      {t:'Стратегия разработки и подбор мероприятий', i:'Оптимизация ППД, включая нестационарное заводнение · ПВЛГ / ПНЛГ · ГТМ'},
      {t:'Проектирование разработки, ВНС, ТЭО КИН', i:'Автовыбор системы разработки · оптимизация размещения фонда · ранжирование точек бурения'}
    ],
    mods:['ABAI Картопостроитель','ABAI ЦРНС 2.0','ABAI Управление заводнением 2.0','ABAI ПиАГТМ','ГГДМ (КМГИ)'],
    note:'На пилоте: выделена перспективная область истощённого 5-го Юрского объекта, намечено бурение 1–2 горизонтальных скважин.'
  },
  skv: {
    no:'03', name:'ЦД скважины', short:'Скважина', color:'#8FBAF0',
    claim:'Сквозной двойник от начала бурения до вывода на режим и последующих ремонтов: контроль параметров в реальном времени, предотвращение аварий, единая среда ТКРС.',
    fx:[{v:'−3%', l:'сроки вывода на режим'}],
    blocks:[
      {t:'Онлайн-мониторинг бурения и сводки', i:'Мониторинг строительства скважин · совместная работа подрядчика и заказчика'},
      {t:'Планирование и контроль ТКРС', i:'График ремонтов · выявление пересечений движения бригад · суточная отчётность · датчики СТПА'}
    ],
    mods:['ABAI Цифровое бурение','ABAI Цифровой мониторинг ТКРС'],
    note:'Появляются инструменты для оценки перехода от бурения «под ключ» к раздельному сервису — новая возможная бизнес-модель.'
  },
  naz: {
    no:'04', name:'ЦД добычи и наземной инфраструктуры', short:'Наземная инфраструктура', color:'#35D0C2',
    claim:'Контроль добычи в реальном времени по действующему фонду: модель работает с данными «с поля», реагирует на изменение дебита, обводнённости и давления, предупреждает об отклонениях.',
    fx:[
      {v:'−13%', l:'ТРЗ на отклонениях режима'},
      {v:'−15%', l:'ТРЗ на расчёты и ГТМ'},
      {v:'−5%', l:'управляемые потери добычи'},
      {v:'−3%', l:'энергозатраты'},
      {v:'−3%', l:'CAPEX/OPEX инфраструктуры'}
    ],
    blocks:[
      {t:'Скважины и режимы фонда', i:'Прогноз и контроль показателей добычи · выявление отклонений режима'},
      {t:'КНС и ППД · экономика', i:'Оценка износа насосов · подбор низкорентабельных скважин под остановку'},
      {t:'Трубопроводы', i:'Предиктивный анализ отказов напорного нефтепровода (машинное обучение)'},
      {t:'Гидравлика · энергетика · подготовка', i:'Загрузка системы сбора и ППД · расчёт электрических сетей · мнемосхема подготовки'}
    ],
    mods:['ABAI ТР','ABAI ПГНО','ABAI Планирование добычи и мониторинг 2.0','ABAI Наземная инфраструктура','Интеллектуальное месторождение'],
    note:'Любое изменение на одном шаге цепочки «пласт — скважина — труба» автоматически пересчитывает все остальные шаги.'
  }
};
const ORDER = ['naz','skv','plast','grr'];   // сверху вниз в списке; подача — снизу вверх

/* ================================================================
   СЦЕНА
   ================================================================ */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 1, 4000);
camera.position.set(330, 235, 330);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
document.getElementById('scene').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xAFC4DE, 0x54432E, 0.95));
const key = new THREE.DirectionalLight(0xF2E8D8, 1.5); key.position.set(300, 420, 220); scene.add(key);
const rim = new THREE.DirectionalLight(0x6E86C8, 0.45); rim.position.set(-260, 120, -300); scene.add(rim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 260; controls.maxDistance = 700;
controls.minPolarAngle = 0.55; controls.maxPolarAngle = 1.35;
controls.target.set(0, -40, 0);
controls.autoRotate = true; controls.autoRotateSpeed = 1.1;

const world = new THREE.Group(); scene.add(world);

/* ---------- размеры блока ---------- */
const W = 210, D = 150;
// слои по y (низ → верх): ГРР | пласт (нефть+вода) | межколонная толща | почва
const Y = { grrB:-150, grrT:-104, oilB:-104, oilT:-72, watB:-72, watT:-46, midB:-46, mid2:-14, soilB:-14, soilT:0 };

/* ---------- утилиты ---------- */
const mat = (c, r=0.92) => new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:0.04, transparent:true });
function slab(yb, yt, color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(W, yt-yb, D), mat(color));
  m.position.y = (yb+yt)/2;
  return m;
}

/* ---------- голограмма: полупрозрачный бокс + сетка + рёбра ---------- */
function gridTexture(hex, nx, ny){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const c = cv.getContext('2d');
  c.strokeStyle = hex; c.lineWidth = 2; c.globalAlpha = 0.9;
  for(let i=0;i<=nx;i++){ const x=i/nx*254+1; c.beginPath(); c.moveTo(x,0); c.lineTo(x,256); c.stroke(); }
  for(let j=0;j<=ny;j++){ const y=j/ny*254+1; c.beginPath(); c.moveTo(0,y); c.lineTo(256,y); c.stroke(); }
  const t = new THREE.CanvasTexture(cv);
  return t;
}
function holoBox(w, h, d, cy, hex, cells=7, fillHex=0x0A2E3E){
  const g = new THREE.Group();
  const fill = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshBasicMaterial({ color:fillHex, transparent:true, opacity:0, depthWrite:false }));
  const grid = new THREE.Mesh(new THREE.BoxGeometry(w+0.4, h+0.4, d+0.4),
    new THREE.MeshBasicMaterial({ map:gridTexture(hex, cells, Math.max(2, Math.round(cells*h/w))),
      transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide }));
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w+0.6, h+0.6, d+0.6)),
    new THREE.LineBasicMaterial({ color:hex, transparent:true, opacity:0 }));
  g.add(fill, grid, edge);
  g.position.y = cy;
  g.userData.parts = { fill, grid, edge };
  return g;
}
function wireClone(srcGroup, hex){
  const g = srcGroup.clone(true);
  const wm = new THREE.MeshBasicMaterial({ color:hex, wireframe:true, transparent:true, opacity:0, depthWrite:false });
  g.traverse(n => { if(n.isMesh) n.material = wm; });
  g.userData.wireMat = wm;
  return g;
}

/* ================================================================
   ЗОНЫ: физическая + цифровая версия каждой
   ================================================================ */
const zones = {};   // id → { phys:Group, digi:Group, mix, target, meshes:[], baseY, digMats:[] }
function makeZone(id){
  const phys = new THREE.Group(), digi = new THREE.Group();
  world.add(phys, digi);
  zones[id] = { id, phys, digi, mix:0, target:0, meshes:[], digMats:[], baseY:0 };
  return zones[id];
}

/* ---------- 01 ГРР: фундамент ---------- */
{
  const z = makeZone('grr');
  const s = slab(Y.grrB, Y.grrT, '#8A7248');
  z.phys.add(s); z.meshes.push(s);
  const h = holoBox(W, Y.grrT-Y.grrB, D, (Y.grrB+Y.grrT)/2, '#9B7BE8', 9, 0x201338);
  z.digi.add(h); z.digMats.push(h.userData.parts);
}

/* ---------- 02 ПЛАСТ: нефтеносный + вода ---------- */
{
  const z = makeZone('plast');
  // вода — под нефтью (ВНК), нефтеносный интервал выше
  const wat = slab(Y.oilB, Y.oilT, '#2E6E9E');
  const oil = slab(Y.watB, Y.watT, '#8A5E30');
  z.phys.add(oil, wat); z.meshes.push(oil, wat);
  // линза нефти — тёплое свечение внутри цифровой версии
  const hWat = holoBox(W, Y.oilT-Y.oilB, D, (Y.oilB+Y.oilT)/2, '#4FA8E8', 9, 0x0A2A44);
  const hOil = holoBox(W, Y.watT-Y.watB, D, (Y.watB+Y.watT)/2, '#F0AE4A', 9, 0x3A280C);
  const lens = new THREE.Mesh(new THREE.SphereGeometry(1, 22, 14),
    new THREE.MeshBasicMaterial({ color:'#F0AE4A', transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false }));
  lens.scale.set(70, 13, 46); lens.position.y = (Y.watB+Y.watT)/2;
  z.digi.add(hOil, hWat, lens);
  z.digMats.push(hOil.userData.parts, hWat.userData.parts);
  z.userData_lens = lens;
}

/* ---------- 03 СКВАЖИНА: межколонная толща + стволы ---------- */
const JACKS = [ [-38,-18], [12,10], [58,-30] ];
{
  const z = makeZone('skv');
  const s1 = slab(Y.midB, Y.mid2, '#B99655');
  const s2 = slab(Y.mid2, Y.soilB, '#6E552F');
  z.phys.add(s1, s2); z.meshes.push(s1, s2);
  const wellsP = new THREE.Group(), wellsD = new THREE.Group();
  const wm = new THREE.MeshStandardMaterial({ color:'#1C2026', roughness:0.55, metalness:0.5, transparent:true });
  const dm = new THREE.MeshBasicMaterial({ color:'#4FE3FF', transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  for(const [x, zz] of JACKS){
    const len = -Y.watB - 8;   // ствол доходит до нефтеносного интервала
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, len, 10), wm);
    tube.position.set(x+9, -len/2, zz);
    wellsP.add(tube);
    const dTube = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, len, 10), dm);
    dTube.position.copy(tube.position);
    wellsD.add(dTube);
    // муфты на цифровой версии
    for(let q=1; q<5; q++){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(4, 0.5, 6, 14), dm);
      ring.rotation.x = Math.PI/2;
      ring.position.set(x+9, -len*q/5, zz);
      wellsD.add(ring);
    }
    // хитбокс пошире, чтобы в ствол легко было попасть курсором
    const hit = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, len, 8),
      new THREE.MeshBasicMaterial({ visible:false }));
    hit.position.copy(tube.position);
    hit.userData.zone = 'skv';
    z.phys.add(hit); z.meshes.push(hit);
  }
  z.phys.add(wellsP); wellsP.traverse(n=>{ if(n.isMesh && n.material===wm) z.meshes.push(n); });
  z.digi.add(wellsD);
  const h1 = holoBox(W, Y.mid2-Y.midB, D, (Y.midB+Y.mid2)/2, '#8FBAF0', 9);
  const h2 = holoBox(W, Y.soilB-Y.mid2, D, (Y.mid2+Y.soilB)/2, '#8FBAF0', 9);
  z.digi.add(h1, h2);
  z.digMats.push(h1.userData.parts, h2.userData.parts);
  z.userData_wellMat = dm;
}

/* ---------- 04 НАЗЕМКА: почва + объекты ---------- */
let jacksAnim = [];
{
  const z = makeZone('naz');
  const soil = slab(Y.soilB, Y.soilT, '#6B5138');
  // верхняя «трава»-плита тонким слоем
  const top = new THREE.Mesh(new THREE.BoxGeometry(W, 1.6, D), mat('#77683F', 1));
  top.position.y = Y.soilT + 0.8;
  z.phys.add(soil, top); z.meshes.push(soil, top);

  const objs = new THREE.Group();
  const dark = () => new THREE.MeshStandardMaterial({ color:'#2A2E34', roughness:0.6, metalness:0.35, transparent:true });

  // станки-качалки
  for(const [x, zz] of JACKS){
    const j = new THREE.Group(); j.position.set(x, Y.soilT+1.6, zz);
    const base = new THREE.Mesh(new THREE.BoxGeometry(26, 2.4, 10), dark()); base.position.y = 1.2; j.add(base);
    const m2 = dark();
    const legs = [[-4,-3],[-4,3],[7,-3],[7,3]];
    for(const [lx, lz] of legs){
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 19, 6), m2);
      leg.position.set(lx*0.6+1, 10, lz);
      leg.rotation.z = (lx<0? -1:1) * -0.22;
      j.add(leg);
    }
    const beam = new THREE.Group(); beam.position.set(1, 19, 0);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(30, 2.2, 2.6), dark()); beam.add(bar);
    const head = new THREE.Mesh(new THREE.BoxGeometry(3.6, 7, 5), dark()); head.position.set(-15, -1.6, 0); beam.add(head);
    j.add(beam);
    const crank = new THREE.Group(); crank.position.set(10, 6, 0);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.8, 10, 2), dark()); arm.position.y = 3.4; crank.add(arm);
    const cw = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 2.4, 12), dark());
    cw.rotation.x = Math.PI/2; cw.position.y = 7.4; crank.add(cw);
    j.add(crank);
    objs.add(j);
    jacksAnim.push({ beam, crank, off: Math.random()*6 });
  }

  // жёлтая установка подготовки
  {
    const p = new THREE.Group(); p.position.set(-62, Y.soilT+1.6, 42);
    const ym = new THREE.MeshStandardMaterial({ color:'#E8B33A', roughness:0.55, metalness:0.15, transparent:true });
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(24, 10, 14), ym); b1.position.y = 5; p.add(b1);
    const b2 = new THREE.Mesh(new THREE.BoxGeometry(12, 7, 10), ym); b2.position.set(16, 3.5, 2); p.add(b2);
    const col = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 24, 10), ym); col.position.set(-8, 12, -2); p.add(col);
    const col2 = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 17, 8), ym); col2.position.set(-2, 8.5, -5); p.add(col2);
    objs.add(p);
  }
  // тёмные блок-боксы
  for(const [bx, bz, bw] of [[-84, 8, 12], [-70, 16, 9]]){
    const shed = new THREE.Mesh(new THREE.BoxGeometry(bw, 7, 8),
      new THREE.MeshStandardMaterial({ color:'#3A3F46', roughness:0.8, transparent:true }));
    shed.position.set(bx, Y.soilT+5.1, bz);
    objs.add(shed);
  }
  // растительность на углу
  {
    const gm = new THREE.MeshStandardMaterial({ color:'#3E5B37', roughness:1, transparent:true });
    const N = 26;
    const inst = new THREE.InstancedMesh(new THREE.ConeGeometry(2.6, 7, 6), gm, N);
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), P = new THREE.Vector3();
    for(let i=0;i<N;i++){
      const x = -95 + Math.random()*40, zz = -68 + Math.random()*42;
      const s = 0.7 + Math.random()*0.9;
      P.set(x, Y.soilT + 1.6 + 3.5*s, zz); S.set(s, s, s);
      M.compose(P, Q, S);
      inst.setMatrixAt(i, M);
    }
    objs.add(inst);
  }
  z.phys.add(objs);
  objs.traverse(n => { if(n.isMesh) z.meshes.push(n); });

  // цифровая версия: голограмма плиты + wireframe-копия объектов
  const h = holoBox(W, Y.soilT-Y.soilB+2, D, (Y.soilB+Y.soilT)/2+0.8, '#35D0C2', 10, 0x07251F);
  const wires = wireClone(objs, '#35D0C2');
  z.digi.add(h, wires);
  z.digMats.push(h.userData.parts);
  z.userData_wire = wires.userData.wireMat;
}

/* рёбра всего блока — тонкий контур в физическом виде */
{
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(W, -Y.grrB, D)),
    new THREE.LineBasicMaterial({ color:0x8FA8C8, transparent:true, opacity:0.18 }));
  edge.position.y = Y.grrB/2;
  world.add(edge);
}

/* лёгкий подиум-тень */
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(128,128,30, 128,128,128);
  g.addColorStop(0,'rgba(0,0,0,0.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0,0,256,256);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(460, 340),
    new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false }));
  sh.rotation.x = -Math.PI/2; sh.position.y = Y.grrB - 22;
  scene.add(sh);
}

/* привязка мешей к зонам для рейкаста */
for(const id in zones) for(const m of zones[id].meshes) m.userData.zone = id;
const pickMeshes = Object.values(zones).flatMap(z => z.meshes);

/* ================================================================
   ИНТЕРАКЦИЯ: hover → оцифровка зоны + окно; клик — закрепить
   ================================================================ */
const state = { hover:null, locked:null };
const active = () => state.locked || state.hover;

const raycaster = new THREE.Raycaster();
const ptr = new THREE.Vector2(-2,-2);
let mouseXY = [0,0];
addEventListener('pointermove', e => {
  ptr.x = (e.clientX/innerWidth)*2 - 1;
  ptr.y = -(e.clientY/innerHeight)*2 + 1;
  mouseXY = [e.clientX, e.clientY];
});
renderer.domElement.addEventListener('click', () => {
  if(state.hover){ state.locked = (state.locked === state.hover) ? null : state.hover; refresh(); }
  else if(state.locked){ state.locked = null; refresh(); }
});
addEventListener('keydown', e => { if(e.key === 'Escape'){ state.locked = null; state.hover = null; refresh(); } });

/* ---------- список слоёв слева (снизу вверх: ГРР — нижний) ---------- */
const elStack = document.getElementById('stack');
for(const id of ORDER){
  const zd = ZONES[id];
  const b = document.createElement('button');
  b.className = 'lay'; b.id = 'lay-'+id;
  b.style.setProperty('--lc', zd.color);
  b.innerHTML = `<div class="n">${zd.no} · контур</div><div class="t">${zd.name}</div>`
    + (id==='grr' ? '<span class="tag">контур 2027</span>' : '');
  b.addEventListener('mouseenter', () => { state.hover = id; refresh(); });
  b.addEventListener('mouseleave', () => { state.hover = null; refresh(); });
  b.addEventListener('click', () => { state.locked = (state.locked===id) ? null : id; refresh(); });
  elStack.appendChild(b);
}

/* ---------- информационное окно ---------- */
const $ = s => document.getElementById(s);
function showPanel(id){
  const zd = ZONES[id];
  $('panel').style.setProperty('--pc', zd.color);
  $('p-kick').textContent = `Контур ${zd.no} · из чего строится ЦД Актива`;
  $('p-name').textContent = zd.name;
  $('p-claim').textContent = zd.claim;
  $('p-fx').innerHTML = zd.fx.map(f => `<div class="fx"><div class="v">${f.v}</div><div class="l">${f.l}</div></div>`).join('');
  $('p-blocks').innerHTML = zd.blocks.map(b => `<div class="bl"><div class="bt">${b.t}</div><div class="bi">${b.i}</div></div>`).join('');
  $('p-mods').innerHTML = zd.mods.map(m => `<span class="mod">${m}</span>`).join('');
  $('p-note').textContent = zd.note;
  $('panel').classList.add('vis');
}
$('p-close').addEventListener('click', () => { state.locked = null; state.hover = null; refresh(); });

const chip = $('chip');
function refresh(){
  const a = active();
  for(const id in zones) zones[id].target = (id === a) ? 1 : 0;
  for(const id of ORDER) $('lay-'+id).classList.toggle('hot', id === a);
  if(a) showPanel(a); else $('panel').classList.remove('vis');
  controls.autoRotateSpeed = a ? 0.35 : 1.1;
}

/* ================================================================
   ЦИКЛ
   ================================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  const k = 1 - Math.exp(-dt*8);

  // рейкаст по модели (только когда курсор реально в кадре)
  let hitZone = null;
  if(Math.abs(ptr.x) <= 1 && Math.abs(ptr.y) <= 1){
    raycaster.setFromCamera(ptr, camera);
    const hits = raycaster.intersectObjects(pickMeshes, false);
    hitZone = hits.length ? hits[0].object.userData.zone : null;
  }
  if(hitZone !== state.hover && document.activeElement?.tagName !== 'BUTTON'){
    // ховер из 3D не перебивает ховер по кнопкам списка
    const overStack = document.querySelector('#stack:hover, #panel:hover');
    if(!overStack){ state.hover = hitZone; refresh(); }
  }
  renderer.domElement.style.cursor = hitZone ? 'pointer' : '';

  // чип у курсора
  if(hitZone && !state.locked){
    chip.style.display = 'block';
    chip.style.left = (mouseXY[0]+16)+'px';
    chip.style.top = (mouseXY[1]+14)+'px';
    chip.style.setProperty('--cc', ZONES[hitZone].color);
    chip.textContent = ZONES[hitZone].no + ' · ' + ZONES[hitZone].short;
  } else chip.style.display = 'none';

  // микс физика → цифра по зонам
  for(const id in zones){
    const z = zones[id];
    z.mix += (z.target - z.mix)*k;
    const m = z.mix;
    // физическая версия гаснет
    z.phys.traverse(n => { if(n.isMesh && n.material.visible !== false) n.material.opacity = 1 - m*0.93; });
    // цифровая проявляется
    const pulse = 0.75 + 0.25*Math.sin(t*3.2);
    for(const p of z.digMats){
      p.fill.material.opacity = 0.42*m;
      p.grid.material.opacity = 0.85*m*pulse;
      p.edge.material.opacity = 0.95*m;
    }
    if(z.userData_wire) z.userData_wire.opacity = 0.8*m*pulse;
    if(z.userData_wellMat) z.userData_wellMat.opacity = 0.9*m*pulse;
    if(z.userData_lens) z.userData_lens.material.opacity = 0.5*m*pulse;
    // выбранная зона слегка увеличивается
    const s = 1 + 0.06*m;
    z.phys.scale.setScalar(s); z.digi.scale.setScalar(s);
  }

  // качалки живут в физическом мире всегда
  for(const j of jacksAnim){
    j.beam.rotation.z = Math.sin((t+j.off)*Math.PI*2/7)*0.15;
    j.crank.rotation.z = (t+j.off)*Math.PI*2/7;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// служебный хук для автотестов (не влияет на показ)
window.__dbg = { renderer, scene, camera, state, zones, refresh, THREE, clockRef: clock };
</script>
</body>
</html>
