<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Демо показа v2 · подводка к цифровому двойнику</title>
<style>
  :root{
    --cyan:#4FE3FF; --amber:#F0AE4A; --teal:#35D0C2; --viol:#9B7BE8;
    --bg0:#050810; --bg1:#0C1626;
    --txt:#D7E2F2; --dim:#7C8DA6; --line:rgba(140,170,210,.22);
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
    --serif:"IBM Plex Serif",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg0);color:var(--txt);overflow:hidden;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}

  /* Одна лента на весь показ. Ни второго слоя, ни подмены источника —
     переключать в кадре нечего, поэтому и мигать нечему. */
  /* Кадр приподнимается вместе с панелью, освобождая карту из-под плиты.
     Двигается только на стоп-кадре, пока лента стоит на паузе: наложение
     сдвига на идущее воспроизведение как раз и давало рывок. */
  #film{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    background:var(--bg0);
    transition:transform .55s cubic-bezier(.22,.61,.36,1)}
  #film.up{transform:translateY(-10%)}
  /* финал: кадр остаётся на месте, панель эффектов ложится поверх правой трети —
     кадр 10 под это и скомпонован, блок в нём уже смещён влево */
  #film.влево{transform:none}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:
      radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(5,8,16,.55) 100%),
      linear-gradient(to top,rgba(5,8,16,.82) 0%,transparent 34%)}

  /* ── титры ───────────────────────────────────────────────────────────── */
  /* Ширина в ch считается по кеглю самого блока, а не заголовка, и 46ch при
     36-м серифе давали заголовку колонку в четыре коротких строки: «От
     разобщённых служб / к кросс- / функциональной / модели», да ещё с переносом
     по дефису. Ширину задаём в долях кадра и отдельно распускаем заголовок —
     он ложится в две строки, а пояснение под ним остаётся узким и читаемым. */
  #cap{position:fixed;left:44px;bottom:74px;z-index:6;max-width:min(52vw,980px);
    opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
  #cap.on{opacity:1;transform:none}
  #cap .k{font-family:var(--mono);font-size:10px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--cc,var(--cyan))}
  #cap .t{font-family:var(--serif);font-size:36px;font-weight:600;
    line-height:1.14;margin-top:8px;text-wrap:balance;
    /* pre-line: перевод строки внутри подписи ломает её там, где задано, а
       лишние пробелы по-прежнему схлопываются */
    white-space:pre-line;
    /* переносов по дефису не хотим: «кросс-» в конце строки читается как обрыв */
    hyphens:none;overflow-wrap:normal}
  /* Пояснение оставляем узким: длинная строка мелким кеглем не читается */
  #cap .s{font-size:14px;color:var(--dim);margin-top:9px;line-height:1.5;max-width:62ch}

  /* ── панель цепочки создания ценности ─────────────────────────────────
     Такт «Эмбамунайгаз» несёт не подпись из трёх строк, а всю цепочку
     UPSTREAM: пять переделов со своими системами. Полосой внизу во всю
     ширину — иначе на карточки не хватает места.
     ──────────────────────────────────────────────────────────────────── */
  /* Панель лежит на собственной подложке: без неё карточки висели прямо на
     кадре и терялись на светлой карте. Верх подложки уходит в прозрачность,
     чтобы плита не отрезала изображение линейкой.
     Кегли рассчитаны на просмотр с расстояния: прежние 9–11 px читались
     только вплотную к монитору. */
  /* ── разбор цепочки: отдельный экран финала ─────────────────────────────
     Та же карта и те же пять карточек, что в подводке, но экран уже не
     проносится мимо — по карточке нажимают и читают, что за ней стоит.
     Поэтому он живёт своей разметкой, а не режимом `#chain`: у той панель
     приклеена к низу кадра и держит ленту, здесь же нужен весь экран.

     Карта стоит снимком, а не кадром ленты: возвращать плёнку на 11-ю секунду
     ради фона значит ломать финал перемоткой на полминуты назад. */
  /* Слой выше рамок слайда и глобуса: это самостоятельный экран, а не панель
     поверх кадра, и живой 3D-слайд под ним обязан остаться позади. Ниже
     кнопки «3д модель» и заставки — те главнее. Фон разложен на longhand:
     в сокращённой записи одна опечатка в url() снимает и заливку, и пелену. */
  #цепь{position:fixed;inset:0;z-index:17;display:flex;flex-direction:column;
    padding:26px 40px 24px;opacity:0;pointer-events:none;
    transition:opacity .5s ease-out;
    background:#04070E}

  /* Карта отдельным слоем, а не фоном экрана. Фону нельзя задать выноски:
     `cover` кадрирует картинку по-разному на разных пропорциях окна, и метка,
     поставленная в процентах от экрана, уезжает с точки. Слой держит
     собственные пропорции кадра (16:9) и раздувается по правилу `cover`
     вручную — тогда проценты внутри него это доли кадра, ровно те же, что у
     выносок в самом показе, и Атырау с Молдабеком стоят на своих координатах
     при любом окне. */
  #цепь .карта{position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:max(100%, 177.78vh);aspect-ratio:16/9;pointer-events:none}
  #цепь .карта img{display:block;width:100%;height:100%}
  #цепь .карта::after{content:'';position:absolute;inset:0;
    background:linear-gradient(rgba(4,7,14,.62),rgba(4,7,14,.84))}
  /* Выноски держим над пеленой, иначе она гасит их вместе с картой */
  /* Сдвиг сажает на координату само кольцо, а не угол блока: у промысла кольцо
     первое в строке, у города — последнее в столбце. Сдвиг равен радиусу. */
  #цепь .тчк{position:absolute;z-index:1;display:flex;align-items:center;
    transform:translate(-13px,-50%);transition:opacity .35s}
  /* Пока разбор раскрыт, выноски гаснут: под раскрытой карточкой они всё равно
     наполовину закрыты, а торчать из-под неё не должны. Флаг вешаем на сам
     экран, а не на ряд: карта стоит в разметке до ряда, и соседним селектором
     до неё не дотянуться. */
  #цепь.разобран .тчк{opacity:0}
  #цепь .тчк .кольцо{width:26px;height:26px;border:2px solid var(--cyan);
    border-radius:50%;flex:0 0 auto;
    box-shadow:0 0 12px rgba(79,227,255,.7), inset 0 0 8px rgba(79,227,255,.32);
    animation:пульс 2.4s ease-in-out infinite}
  #цепь .тчк .лн{width:44px;height:1px;flex:0 0 auto;
    background:linear-gradient(90deg,rgba(79,227,255,.9),rgba(79,227,255,.25))}
  #цепь .тчк .тк{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
    text-transform:uppercase;color:#EAF2FF;white-space:nowrap;
    background:rgba(8,14,26,.82);border-left:2px solid var(--cyan);
    padding:5px 9px;backdrop-filter:blur(6px)}
  /* Атырау — город, а не актив: кольцо белое и подпись стоит над ним, как в
     подводке. Голубой там занят промыслом, и две одинаковые точки читались бы
     как два месторождения. */
  #цепь .тчк.город{flex-direction:column;align-items:flex-start;gap:7px;
    transform:translate(-10px,calc(-100% + 10px))}
  #цепь .тчк.город .кольцо{width:20px;height:20px;border-color:#FFFFFF;
    box-shadow:0 0 12px rgba(255,255,255,.55), inset 0 0 8px rgba(255,255,255,.3)}
  #цепь .тчк.город .тк{border-left-color:#FFFFFF}
  #цепь.on{opacity:1;pointer-events:auto}
  /* Карта — абсолютный слой, и по умолчанию она легла бы поверх шапки и ряда:
     позиционированный элемент рисуется выше потока. Поэтому поток поднимаем
     явно, а не полагаемся на порядок в разметке. */
  #цепь .hd,#цепь .row{position:relative;z-index:1}
  /* Шапка с рядом стоят внизу экрана, как панель цепочки в подводке, а не по
     центру: середина кадра — это сама карта, и по центру карточки садились
     ровно на Атырау с Молдабеком и закрывали обе выноски. */
  #цепь .hd{font-family:var(--mono);font-size:15px;letter-spacing:.22em;
    text-transform:uppercase;color:#9DB4CE;margin:auto 0 16px;flex:0 0 auto}
  /* Ряд живёт двумя высотами: закрытый — полоса карточек, как в подводке;
     раскрытый вырастает под содержание. Ряд во весь экран оставлял под текстом
     полэкрана пустоты, а фиксированный высокий — те же пустоты всегда. */
  #цепь .row{display:flex;align-items:stretch;gap:0;flex:0 0 auto;
    height:240px;
    transition:height .45s cubic-bezier(.22,.61,.36,1)}
  #цепь .row.разобрана{height:min(64vh,620px)}
  /* Карточка тянется флексом, а не шириной: раскрытая забирает место у
     соседей, но ряд остаётся рядом — цепочка не рвётся и стрелки на месте. */
  #цепь .card{flex:1 1 0;min-width:0;background:rgba(11,18,30,.9);
    border-top:3px solid var(--amber);padding:15px 18px 16px;cursor:pointer;
    display:flex;flex-direction:column;overflow:hidden;
    transition:flex-grow .45s cubic-bezier(.22,.61,.36,1),background .3s,border-color .3s}
  #цепь .card:hover{background:rgba(18,29,47,.94)}
  #цепь .card.открыта{flex-grow:4.2;background:rgba(13,22,37,.96);cursor:default}
  /* Пока одна раскрыта, соседи ужимаются до номера и названия: подзаголовок и
     система в узкой колонке всё равно переносятся в столбик и читаются хуже,
     чем не читаются вовсе. */
  /* У ужатой карточки название меняется на короткое. Переносить длинное было
     нечем: «геологоразведка» в узкую колонку не влезает ни при каком кегле, а
     разрыв посреди слова читается как ошибка вёрстки. */
  #цепь .row.разобрана .card:not(.открыта){flex-grow:.62}
  #цепь .nmк{display:none;font-size:17px;font-weight:600;color:#F2F7FF;
    margin-top:9px;line-height:1.2}
  #цепь .row.разобрана .card:not(.открыта) .nm{display:none}
  #цепь .row.разобрана .card:not(.открыта) .nmк{display:block}
  #цепь .row.разобрана .card.серая .nmк{color:#C6D3E4}
  #цепь .row.разобрана .card:not(.открыта) .sb,
  #цепь .row.разобрана .card:not(.открыта) .sy{opacity:0}
  #цепь .no{font-family:var(--mono);font-size:16px;color:var(--amber);
    letter-spacing:.12em}
  #цепь .nm{font-size:21px;font-weight:600;color:#F2F7FF;margin-top:9px;line-height:1.2}
  #цепь .sb{font-family:var(--mono);font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--teal);margin-top:9px;transition:opacity .3s}
  #цепь .sy{font-size:13.5px;color:#B79BF0;margin-top:10px;line-height:1.35;
    transition:opacity .3s}
  #цепь .ar{flex:0 0 34px;display:flex;align-items:center;justify-content:center;
    color:#4A5A70;font-size:19px}
  /* Серая карточка: контур ресурсной базы в пилот не входит. Из цепочки передел
     никуда не делся — прятать его нельзя, иначе цепочка выглядит короче, чем
     она есть. Но и путать его с четырьмя рабочими нельзя, поэтому он выключен
     сразу четырьмя средствами: приглушённый цвет, штриховка по диагонали,
     значок «вне пилота» в углу и погашенная стрелка на выходе. Одного цвета
     мало: на проекторе серое от синего почти не отличается. */
  /* Приглушённая, но рабочая карточка. Первая версия гасила её до цвета
     выключенного передела: текст переставал читаться, и на проекторе она
     выглядела такой же нерабочей, как вычеркнутая. Отличие несёт не тусклость,
     а другой ключ — холодная кромка вместо янтарной, плотнее фон и штриховка.
     Сам текст остаётся почти в полную силу. */
  #цепь .card.серая{position:relative;
    border-top-color:#8FA3BC;background:rgba(11,15,23,.9)}
  #цепь .card.серая::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(135deg,
      transparent 0 9px, rgba(124,141,166,.05) 9px 18px)}
  /* Карточка без содержания — та, чей передел в пилот не входит. Она уже, по
     ней не нажимают и подсветки под курсором у неё нет. Приглушённая, но
     рабочая карточка ведёт себя как все остальные. */
  #цепь .card.безсодержания{flex-grow:.78;cursor:default}
  #цепь .card.безсодержания:hover{background:rgba(9,12,18,.9)}
  #цепь .card.серая .no{color:#9CB0C6}
  #цепь .card.серая .nm{color:#E4ECF7}
  #цепь .card.серая .sb{color:#8FB6AF}
  #цепь .card.серая .sy{color:#A38DD6}
  #цепь .знак{position:absolute;right:12px;top:13px;z-index:1;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#93A3B8;padding:3px 7px;
    border:1px solid rgba(147,163,184,.38)}
  #цепь .ar.тусклая{color:#28313D}
  #цепь .вне{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;
    text-transform:uppercase;color:#8A93A3;margin-top:auto;line-height:1.5;
    padding-top:12px;border-top:1px solid rgba(124,141,166,.16)}
  #цепь .вне b{color:#C0A268;font-weight:600}
  /* Содержание раскрытой карточки. Разделов бывает и пять — пускаем в две
     колонки, иначе последний уходит под обрез экрана. */
  #цепь .тело{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);
    opacity:0;overflow:auto;flex:1;min-height:0;transition:opacity .35s .15s}
  #цепь .card.открыта .тело{opacity:1}
  #цепь .тело .зг{font-size:15px;color:#F2F7FF;line-height:1.35;margin-bottom:14px}
  #цепь .тело .кол{column-count:2;column-gap:28px}
  #цепь .тело .гр{break-inside:avoid;margin-bottom:13px}
  #цепь .тело .гн{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--teal);margin-bottom:5px}
  #цепь .тело ul{list-style:none;margin:0;padding:0}
  #цепь .тело li{font-size:13.5px;color:#C6D4E6;line-height:1.4;padding-left:13px;
    position:relative;margin-bottom:3px}
  #цепь .тело li::before{content:'·';position:absolute;left:2px;color:var(--amber)}
  /* Кнопка «дальше» намеренно тихая и одна: по экрану нажимают много, и
     промахнуться мимо карточки на уход к эффектам нельзя — сам экран нажатия
     дальше не пропускает, уводит только она. */
  #цепь .вперёд{position:absolute;right:22px;top:50%;transform:translateY(-50%);
    z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:#8FA6C0;background:rgba(8,14,26,.5);
    border:1px solid rgba(143,166,192,.3);padding:14px 9px;cursor:pointer;
    writing-mode:vertical-rl;opacity:.34;transition:opacity .25s,border-color .25s}
  #цепь .вперёд:hover{opacity:1;border-color:var(--amber);color:#FFD79A}

  #chain{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:24px 40px 22px;
    background:linear-gradient(to top,
      rgba(4,7,14,.985) 0%, rgba(4,7,14,.965) 66%,
      rgba(4,7,14,.78) 88%, rgba(4,7,14,0) 100%);
    opacity:0;transform:translateY(100%);
    transition:transform .75s cubic-bezier(.22,.61,.36,1),opacity .4s;
    pointer-events:none}
  #chain.on{opacity:1;transform:none}
  #chain .hd{font-family:var(--mono);font-size:15px;letter-spacing:.22em;
    text-transform:uppercase;color:#9DB4CE;margin-bottom:12px}
  #chain .row{display:flex;align-items:stretch;gap:0}
  /* Карточки собираются по очереди слева направо — цепочка выстраивается,
     а не возникает целиком. */
  #chain .card{flex:1;min-width:0;background:rgba(11,18,30,.94);
    border-top:3px solid var(--amber);padding:15px 18px 16px;
    opacity:0;transform:translateY(14px) scale(.97);filter:blur(3px);
    transition:opacity .45s ease-out,transform .45s ease-out,filter .45s ease-out}
  #chain.on .card{opacity:1;transform:none;filter:none}
  #chain .ar{opacity:0;transition:opacity .3s ease-out}
  #chain.on .ar{opacity:1}
  /* Задержки очерёдности проставляются при сборке, а не селектором: карточки и
     стрелки идут вперемешку и все они div, поэтому nth-of-type попадал мимо. */
  #chain .no{font-family:var(--mono);font-size:16px;color:var(--amber);
    letter-spacing:.12em;opacity:.85}
  #chain .nm{font-size:21px;font-weight:600;color:#F2F7FF;margin-top:9px;
    line-height:1.2;letter-spacing:-.01em}
  #chain .sb{font-family:var(--mono);font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--teal);margin-top:10px;line-height:1.35}
  #chain .sy{font-size:13.5px;color:#B79BF0;margin-top:10px;line-height:1.35}
  #chain .ar{flex:0 0 34px;display:flex;align-items:center;justify-content:center;
    color:#6E839C;font-size:19px}

  /* Под цепочкой — тот же периметр, но глазами ИТ: те же переделы, набитые
     несвязанными системами. Смысл строки в том, что единого слоя между ними
     нет, поэтому системы показаны разрозненными плашками. */
  /* Разделитель отбивает цепочку от ландшафта: это два разных высказывания,
     и без черты они читались как одна каша из плашек. */
  #chain .land{margin-top:16px;padding-top:15px;
    border-top:1px solid rgba(140,170,210,.16)}
  #chain .land .hd2{font-family:var(--mono);font-size:15px;letter-spacing:.22em;
    text-transform:uppercase;color:#9DB4CE;margin-bottom:11px}
  #chain .land .row2{display:flex;gap:26px;align-items:flex-start}
  #chain .grp{flex:1;min-width:0;
    opacity:0;transform:translateY(10px);filter:blur(2px);
    transition:opacity .4s ease-out,transform .4s ease-out,filter .4s ease-out}
  #chain.on .grp{opacity:1;transform:none;filter:none}
  #chain .grp .gn{font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;
    text-transform:uppercase;color:#8296AE;margin-bottom:8px}
  #chain .grp .chips{display:flex;flex-wrap:wrap;gap:6px}
  #chain .chip{font-family:var(--mono);font-size:12.5px;line-height:1;
    padding:6px 9px;border:1px solid rgba(150,180,215,.34);
    color:#C8D8EA;background:rgba(14,25,42,.85);white-space:nowrap}
  #chain .chip.abai{border-color:#4E8FE8;color:#A8CBF6;background:rgba(23,50,92,.85)}

  /* ── эффекты по контурам ──────────────────────────────────────────────
     Стоит справа вертикально: блок изображения занимает левую половину кадра,
     и горизонтальная полоса внизу перекрыла бы сам двойник. Выходит на самом
     финале, когда говорить о цифрах уже уместно.
     ──────────────────────────────────────────────────────────────────── */
  #effects{position:fixed;right:34px;top:5.5%;width:38%;max-height:89%;z-index:6;
    padding:22px 26px 20px;overflow:hidden auto;   /* на 720p панель выше кадра — лучше прокрутить */
    background:linear-gradient(180deg,rgba(6,11,20,.96),rgba(4,8,15,.985));
    border:1px solid rgba(140,170,210,.16);
    opacity:0;transform:translateX(40px);
    transition:opacity .5s,transform .6s cubic-bezier(.22,.61,.36,1);
    pointer-events:none}
  #effects.on{opacity:1;transform:none}
  #effects .hd{font-family:var(--mono);font-size:13.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--amber);margin-bottom:16px}

  #effects .ct{border-top:2px solid var(--amber);padding:12px 0 14px;
    opacity:0;transform:translateY(10px);
    transition:opacity .4s ease-out,transform .4s ease-out}
  #effects.on .ct{opacity:1;transform:none}
  #effects .ct .nm{font-family:var(--mono);font-size:14px;letter-spacing:.1em;
    text-transform:uppercase;color:#F2F7FF;font-weight:600}
  #effects .fx{display:flex;align-items:baseline;gap:10px;margin-top:9px}
  #effects .fx .v{font-family:var(--mono);font-size:27px;color:var(--teal);
    line-height:1;flex:0 0 auto}
  #effects .fx .l{font-size:14px;color:#9DB4CE;line-height:1.3}

  /* Рельс слева от списка собирал три контура в один поток и заканчивался
     стрелкой в блок со сводной цифрой. Свод переехал на этап тиражирования, и
     рельс со стрелкой снят вместе с ним: вести из ниоткуда в никуда он не
     должен. Отступ у списка тоже вернулся к нулю. */

  /* Дорожная карта отделена: это уже не эффект, а сроки */
  #effects .road{margin-top:16px;padding-top:16px;
    border-top:1px solid rgba(140,170,210,.16)}
  #effects .rd{border-left:2px solid var(--cyan);padding:2px 0 2px 12px;
    margin-bottom:12px;
    opacity:0;transform:translateY(10px);
    transition:opacity .4s ease-out,transform .4s ease-out}
  #effects.on .rd{opacity:1;transform:none}
  #effects .rd .v{font-family:var(--mono);font-size:19px;color:#EAF2FF;line-height:1.1}
  #effects .rd .l{font-size:13px;color:#8296AE;margin-top:4px;line-height:1.3}

  /* ── справка по объекту ───────────────────────────────────────────────
     Первый шаг финала: собранный двойник стоит в кадре, а рядом — карточка
     самого месторождения. Раньше на этом шаге кадр был нем, и докладчику
     нечего было показать рукой, пока он говорит про пилот.

     Стоит в том же правом слоте, что и панель эффектов, и в той же вёрстке:
     на следующем нажатии одна сменяет другую на месте, без переезда кадра.
     ──────────────────────────────────────────────────────────────────── */
  /* Прокрутка на случай узкого экрана: на 1080p справка влезает целиком, на
     ноутбучных 720p — нет, и лучше прокрутить, чем потерять нижние строки. */
  #справка{position:fixed;right:34px;top:5.5%;width:38%;max-height:89%;z-index:6;
    padding:22px 26px 20px;overflow:hidden auto;
    background:linear-gradient(180deg,rgba(6,11,20,.96),rgba(4,8,15,.985));
    border:1px solid rgba(140,170,210,.16);
    opacity:0;transform:translateX(40px);
    transition:opacity .5s,transform .6s cubic-bezier(.22,.61,.36,1);
    pointer-events:none}
  #справка.on{opacity:1;transform:none}
  #справка .hd{font-family:var(--mono);font-size:13.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--cyan);margin-bottom:16px}
  #справка .nm{font-family:var(--mono);font-size:26px;letter-spacing:.06em;
    color:#F2F7FF;line-height:1.15;border-top:2px solid var(--cyan);padding-top:14px}
  #справка .sub{font-size:14px;color:#9DB4CE;margin-top:8px;line-height:1.35}
  /* Два яруса, каждый своим нажатием: сделанное сверху, паспорт под ним. */
  #справка .ярус{margin-top:16px;padding-top:14px;
    border-top:1px solid rgba(140,170,210,.16);
    opacity:0;transform:translateY(10px);
    transition:opacity .5s cubic-bezier(.22,.61,.36,1),
               transform .5s cubic-bezier(.22,.61,.36,1)}
  #справка .ярус.on{opacity:1;transform:none}
  #справка .ярус:empty{display:none}
  /* Строк много: два яруса по шесть-семь. Плотность поднята, иначе панель не
     влезает в кадр даже на 1080p. Появление строк ведёт сам ярус, а не панель —
     ярусы выходят разными нажатиями. */
  #справка .rw{display:flex;gap:12px;padding:6px 0;
    border-bottom:1px solid rgba(140,170,210,.09);
    opacity:0;transform:translateY(10px);
    transition:opacity .4s ease-out,transform .4s ease-out}
  #справка .ярус.on .rw{opacity:1;transform:none}
  #справка .rw:last-child{border-bottom:0}
  #справка .rw .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:#7C8DA6;flex:0 0 40%;line-height:1.35}
  #справка .rw .v{font-size:13px;color:#DCE7F5;line-height:1.35}
  /* заголовок яруса */
  #справка .гр{padding:0 0 6px;
    font-family:var(--mono);font-size:10px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--cyan)}
  /* источник цифр — мелко, но на экране: в этом зале спросят, откуда данные */
  #справка .src{margin-top:12px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.08em;color:#5E7089}

  /* Низкий экран: с раскрытыми обоими ярусами справка это тринадцать строк, и на
     1366×768 она упиралась в предел высоты — часть уходила в прокрутку.
     Прокрученного на показе никто не увидит, поэтому сжимаем содержимое. */
  @media (max-height:900px){
    #справка{padding:16px 22px 16px}
    #справка .nm{font-size:22px}
    #справка .sub{font-size:13px;margin-top:6px}
    #справка .ярус{margin-top:12px;padding-top:11px}
    /* 3, а не 4: на 1280×720 содержимое переваливало за короб на четыре
       пикселя и панель показывала полосу прокрутки из-за одного зазора */
    #справка .rw{padding:3px 0}
    #справка .rw .k{font-size:10.5px}
    #справка .rw .v{font-size:12.5px}
    #справка .src{margin-top:9px}
  }

  /* ── выноска на объект в кадре ────────────────────────────────────────
     Подпись привязана к точке самой ленты, а не к углу экрана: иначе на
     другом соотношении сторон она уедет от объекта. Координаты считаются
     от фактического положения кадра под object-fit: cover.
     ──────────────────────────────────────────────────────────────────── */
  /* Сдвиг ровно на половину кружка: на точку садится он, а линия с подписью
     уходят вправо. Центрировать всю выноску нельзя — её тянет текст. */
  #mark{position:fixed;z-index:6;display:flex;align-items:center;
    opacity:0;pointer-events:none;transform:translate(-17px,-50%);
    transition:opacity .5s, top .75s cubic-bezier(.22,.61,.36,1)}
  #mark.on{opacity:1}
  #mark .dot{width:34px;height:34px;border:2px solid var(--cyan);border-radius:50%;
    box-shadow:0 0 14px rgba(79,227,255,.75), inset 0 0 10px rgba(79,227,255,.35);
    flex:0 0 auto;animation:пульс 2.4s ease-in-out infinite}
  @keyframes пульс{0%,100%{transform:scale(1);opacity:.85}
                   50%{transform:scale(1.14);opacity:1}}
  #mark .ln{width:52px;height:1px;background:linear-gradient(90deg,
    rgba(79,227,255,.9),rgba(79,227,255,.25));flex:0 0 auto}
  #mark .tx{font-family:var(--mono);font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:#EAF2FF;white-space:nowrap;
    background:rgba(8,14,26,.82);border-left:2px solid var(--cyan);
    padding:6px 10px;backdrop-filter:blur(6px)}

  /* ── Атырау: ЦИО ──────────────────────────────────────────────────────
     Своя точка на карте, отдельно от промысла: метка города над кольцом,
     кольцо ровно на координате. Сдвиг по вертикали на всю высоту минус радиус
     — иначе на координату садится верх блока, а не сама точка.

     Цвет белый, и это перебор трёх вариантов. Янтарь совпал с контуром самой
     области и точка в нём растворилась — область на этом кадре залита оранжевым
     от края до края. Голубой занят промыслом: две одинаковые точки читались бы
     как два месторождения. Фиолетовый ушёл к КМГИ. Белый на оранжевом даёт
     максимальный контраст и честно говорит, что это город, а не актив.
     ──────────────────────────────────────────────────────────────────── */
  #cio{position:fixed;z-index:6;display:flex;flex-direction:column;
    align-items:flex-start;gap:8px;
    opacity:0;pointer-events:none;transform:translate(-13px,calc(-100% + 13px));
    transition:opacity .5s, top .75s cubic-bezier(.22,.61,.36,1)}
  #cio.on{opacity:1}
  /* панель ИТ-ландшафта накрыла точку — Атырау уходит целиком */
  #cio.накрыт{opacity:0}

  /* Текстовая часть стоит своей областью кадра — левее и выше точки, в пустой
     середине области. Ширина тоже в долях кадра: лента тянется по окну, и в
     пикселях блок уехал бы с карты на другом разрешении. */
  #инфо{position:fixed;z-index:6;display:flex;flex-direction:column;gap:10px;
    pointer-events:none}
  #cio .dot{width:24px;height:24px;border:2px solid #FFFFFF;border-radius:50%;
    box-shadow:0 0 16px rgba(255,255,255,.85), 0 0 4px rgba(5,8,16,.9),
      inset 0 0 8px rgba(255,255,255,.35);
    flex:0 0 auto;animation:пульс 2.4s ease-in-out infinite}
  /* ядро в кольце: пустой кружок на пёстрой карте читается как дырка */
  #cio .dot::after{content:'';display:block;width:6px;height:6px;margin:7px auto 0;
    border-radius:50%;background:#FFFFFF}
  #cio .tx{font-family:var(--mono);font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:#FFFFFF;white-space:nowrap;
    background:rgba(8,14,26,.9);border-left:2px solid #FFFFFF;
    padding:6px 10px;backdrop-filter:blur(6px);margin-left:2px}

  /* Карточка центра. Ширину задаёт контейнер: она в долях кадра. */
  #инфо .карта{background:rgba(8,14,26,.88);border:1px solid rgba(140,170,210,.18);
    border-left:2px solid var(--amber);padding:12px 14px 13px;
    backdrop-filter:blur(6px);
    opacity:0;transform:translateY(10px);
    transition:opacity .45s,transform .45s}
  #инфо .карта.on{opacity:1;transform:none}
  #инфо .карта:empty{display:none}
  #инфо .карта .ш{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--amber);line-height:1.35}
  /* Цепь «пласт — труба — скважина» звеньями, а не строкой: так видно, что это
     последовательность объектов, а не перечисление через запятую. */
  #инфо .карта .цепь{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
  #инфо .карта .цепь span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:#EAF2FF;border:1px solid rgba(240,174,74,.45);
    padding:3px 8px}
  #инфо .карта .цепь i{color:#5E7089;font-style:normal;font-size:11px}
  #инфо .карта .стр{font-size:12px;color:#9DB4CE;line-height:1.42;margin-top:6px;
    padding-left:11px;position:relative}
  #инфо .карта .стр::before{content:'';position:absolute;left:0;top:7px;
    width:4px;height:4px;background:rgba(140,170,210,.5)}
  #инфо .карта .стр:first-of-type{margin-top:11px;padding-top:10px;
    border-top:1px solid rgba(140,170,210,.14)}
  #инфо .карта .стр:first-of-type::before{top:17px}

  /* ── КМГИ ─────────────────────────────────────────────────────────────
     Отдельный блок и отдельный цвет. Это не точка на карте, а операционная
     модель института: внутри карточки ЦИО смысл слипался с центром в одно
     сообщение, а фиолетовый в этой палитре не занят ни промыслом, ни областью.
     Стоит слева — там свободное поле кадра и не спорит ни с Атырау, ни с
     выноской промысла справа.
     ──────────────────────────────────────────────────────────────────── */
  /* КМГИ — сосед ЦИО, не его продолжение: та же область, но своя рамка и свой
     цвет. Фиолетовый в этой палитре не занят ни промыслом, ни областью.
     Внутри одна строка: расшифровку докладчик проговаривает вслух, а три пункта
     под шапкой перебивали саму карточку центра. */
  #kmgi{background:rgba(8,14,26,.88);border:1px solid rgba(155,123,232,.28);
    border-left:2px solid var(--viol);padding:13px 15px;
    backdrop-filter:blur(6px);
    opacity:0;transform:translateY(10px);
    transition:opacity .5s,transform .5s cubic-bezier(.22,.61,.36,1)}
  #kmgi.on{opacity:1;transform:none}
  #kmgi .ш{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--viol);line-height:1.4}
  #kmgi .стрк:empty{display:none}
  #kmgi .стрк{margin-top:11px;padding-top:10px;
    border-top:1px solid rgba(155,123,232,.2)}
  #kmgi .стрк div{position:relative;padding-left:12px;font-size:12.5px;
    color:#9DB4CE;line-height:1.45;margin-top:7px}
  #kmgi .стрк div:first-child{margin-top:0}
  #kmgi .стрк div::before{content:'';position:absolute;left:0;top:7px;
    width:4px;height:4px;background:rgba(155,123,232,.65)}

  /* ── приглашение к следующему такту ──────────────────────────────────── */
  #go-next{position:fixed;right:44px;bottom:74px;z-index:6;display:flex;
    align-items:center;gap:11px;font-family:var(--mono);font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    opacity:0;transition:opacity .4s;pointer-events:none}
  #go-next.on{opacity:1}
  #go-next .a{font-size:17px;line-height:1;color:var(--cyan);
    animation:nudge 1.7s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0);opacity:.55}
                   50%{transform:translateX(5px);opacity:1}}

  /* ── шкала тактов ────────────────────────────────────────────────────── */
  #bar{position:fixed;left:0;right:0;bottom:0;height:2px;z-index:7;
    background:rgba(140,170,210,.14);display:flex;gap:2px;padding:0 2px}
  #bar i{flex:1;background:rgba(140,170,210,.14);position:relative;overflow:hidden}
  #bar i::after{content:'';position:absolute;inset:0;background:var(--cyan);
    transform:scaleX(var(--p,0));transform-origin:left;transition:transform .1s linear}

  /* ── кнопки, в стиле слайда ──────────────────────────────────────────── */
  .btn{position:fixed;z-index:8;display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:8px 13px;
    background:rgba(10,18,32,.45);backdrop-filter:blur(6px);opacity:.42;cursor:pointer;
    transition:opacity .25s,color .25s,border-color .25s,background .25s}
  .btn:hover,.btn:focus-visible{opacity:1;color:var(--cyan);border-color:var(--cyan);
    background:rgba(79,227,255,.08);outline:none}
  /* Справа сверху сменяются две кнопки на одном месте: пока идёт подводка —
     «пропустить», после неё, на модели, — уход на отдельный слайд. Вторая
     живёт поверх модели, поэтому слой выше iframe. */
  #skip{right:26px;top:20px}
  #tov1{right:26px;top:20px;z-index:18;display:none}

  /* ── стартовый экран ─────────────────────────────────────────────────── */
  #start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;text-align:center;
    background:radial-gradient(ellipse at 50% 34%,#0C1626 0%,#050810 72%);
    transition:opacity .7s}
  #start.gone{opacity:0;pointer-events:none}
  #start .k{font-family:var(--mono);font-size:10px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--cyan)}
  #start h1{font-family:var(--serif);font-size:40px;font-weight:600;margin:0;line-height:1.2}
  #start p{margin:0;color:var(--dim);max-width:52ch;line-height:1.6}
  #go{margin-top:10px;position:static;opacity:1;color:var(--txt);
    border-color:var(--cyan);padding:13px 26px;font-size:11px}
  #go:hover{background:rgba(79,227,255,.12)}
  #start .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);margin-top:26px;line-height:1.9}
  #start .load{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);opacity:.7;height:12px}

  /* Переключатель финальной панели: на части показов цифры называет докладчик,
     и выводить их на экран не нужно. Решение принимается до старта. */
  #fx-sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);user-select:none;
    transition:color .25s}
  #fx-sw:hover{color:#B9CBE2}
  #fx-sw input{position:absolute;opacity:0;pointer-events:none}
  #fx-sw .sw{width:34px;height:18px;border:1px solid var(--line);
    background:rgba(10,18,32,.6);position:relative;flex:0 0 auto;
    transition:border-color .25s,background .25s}
  #fx-sw .sw::after{content:'';position:absolute;top:2px;left:2px;
    width:12px;height:12px;background:var(--dim);
    transition:transform .25s,background .25s}
  #fx-sw input:checked + .sw{border-color:var(--cyan);background:rgba(79,227,255,.12)}
  #fx-sw input:checked + .sw::after{transform:translateX(16px);background:var(--cyan)}
  #fx-sw input:focus-visible + .sw{outline:1px solid var(--cyan);outline-offset:2px}

  /* ── живой слайд: грузится под лентой с начала показа ────────────────── */
  #slide{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:15;
    opacity:0;pointer-events:none;transition:opacity .9s ease-in}
  #slide.on{opacity:1;pointer-events:auto}

  /* ── этап тиражирования: планета с областями, после финала ────────────
     Тоже <iframe>, тоже поднимается заранее — но слоем выше слайда и ниже
     кнопки «3д модель», чтобы она осталась нажимаемой поверх глобуса. */
  #globe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:16;
    opacity:0;pointer-events:none;transition:opacity .9s ease-in}
  #globe.on{opacity:1;pointer-events:auto}

  /* ── водяной знак ──────────────────────────────────────────────────────
     Виден на каждом такте: на кадре, на модели, на планете и на заставках,
     поэтому слой выше всего, что показ поднимает поверх ленты. Стоит справа
     сверху, ровно под «пропустить» — та же линия правого края.
     С финала, когда справа выезжает карточка пилотного актива, а за ней
     панель эффектов и планета, знак съезжает в правый нижний угол и остаётся
     там до конца. Тень держит белые буквы читаемыми на светлых кадрах карты. */
  #знак{position:fixed;right:26px;top:64px;z-index:30;pointer-events:none;
    height:50px;opacity:.32;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
    transition:top .8s cubic-bezier(.22,.61,.36,1)}
  #знак svg{display:block;height:100%;width:auto}
  /* Съезд вниз задаётся соседним селектором: знак стоит в разметке после всех
     четырёх слоёв, поднимающих правый верхний угол, и отдельного кода не надо. */
  #справка.on ~ #знак, #effects.on ~ #знак,
  #slide.on ~ #знак, #globe.on ~ #знак{top:calc(100% - 66px)}   /* 50 высота + 16 поле */
</style>

<script>
/* ────────────────────────────────────────────────────────────────────────
   Подводка — одна непрерывная лента `переход/подводка.mp4`. Такт это не
   отдельный файл, а отрезок внутри неё.

   Почему так. Пока такты были девятью файлами, каждое переключение меняло
   источник картинки, и на стыке проскакивал кадр чужого состояния. Здесь
   переключать нечего: шаг вперёд — это просто снятие паузы, лента идёт
   дальше с того же кадра, на котором стояла. Ни перемотки, ни подгрузки.

   Шаг назад — единственное место, где перемотка нужна. Лента собрана с
   опорными кадрами ровно на границах тактов (`-force_key_frames`), поэтому
   перемотка попадает в границу, а не в ближайший опорный кадр в стороне.

   Границы взяты по факту из готового файла, а не из задуманных значений:
   кодировщик ставит опорный кадр в ближайший кадр сетки, расхождение до
   1/24 секунды.
   ──────────────────────────────────────────────────────────────────────── */

/* ── подписи ──────────────────────────────────────────────────────────
   Подпись описывает кадр, к которому лента приходит, а не движение по дороге
   к нему. Поэтому каждая выходит титром за 0,7 с до конца своего такта — уже
   на нужном кадре, — а всю дорогу до неё держится подпись предыдущего такта.
   Раньше подпись менялась в момент стыка, то есть в начале движения: зритель
   читал про план промысла, пока камера ещё летела к нему, и к моменту, когда
   план появлялся, подпись была дочитана и забыта.

   Отсюда и то, что каждая подпись стоит на двух тактах подряд: на своём и на
   следующем. Объявлены отдельными константами, чтобы правка шла в одном
   месте, а не в двух расходящихся копиях.

   Такт 0 — исключение: его подпись открывает показ и стоит с первого кадра,
   ждать ей нечего. Такт 1 подписи не несёт вовсе: там своё высказывание —
   панель цепочки переделов. */
const ЗАРАНЕЕ = 0.7;        // за сколько до конца такта выходит титр
/* Первая подпись после панели цепочки выходит раньше прочих: до неё на экране
   пусто, глазу не за что зацепиться, и полсекунды форы уходит на то, чтобы
   вообще заметить появление. У остальных на этом месте стоит предыдущая
   подпись, и смена читается сама. */
const ЗАРАНЕЕ_ПЕРВЫЙ = 1.2;
/* Унаследованная подпись уходит вскоре после начала такта, не дожидаясь
   смены: к этому времени она прочитана, а держать её до самого прихода новой
   значит объяснять старым кадром то, что на экране уже другое. */
const УХОД = 0.67;

const ПРОГРАММА = {
  k:'Программа «Цифровой двойник» · целевой образ',
  t:'Цифровой двойник месторождения на базе ИС «ABAI»',
  s:'Интеллектуальная виртуальная копия производственных объектов реального мира, '
   +'связанных по цепочке «пласт — скважина — добыча и наземная инфраструктура»',
  c:'#4FE3FF',
};
const ПИЛОТ = {
  k:'Пилот проекта',
  /* Перенос задан в самой строке: недропользователь и промысел это две разные
     вещи, и в одну строку через точку они читались как одно длинное имя. Ломаем
     переводом строки, а не разметкой — подпись ставится через textContent, и
     пускать в неё HTML ради одного переноса незачем. */
  t:'АО «Эмбамунайгаз»\nВосточный Молдабек',
  s:'Стартовая площадка Цифрового двойника Актива КМГ · '
  + 'системная оцифровка промысла идёт с 2015 года',
  c:'#4FE3FF',
};
/* Такт после контура месторождения говорит про операционную модель, а не про
   сам ЦИО: центр — средство, а сказать надо, что изменилось в работе служб. */
const ОПЕРМОДЕЛЬ = {
  k:'Операционная модель',
  t:'От разобщённых служб к кросс-функциональной модели',
  s:'Решения принимаются на едином наборе данных и общей картине состояния актива',
  c:'#4FE3FF',
};
const ИНФРАСТРУКТУРА = {
  k:'Инфраструктура',
  t:'Высокая технологическая готовность актива',
  s:'Развитая автоматизация и телеметрия позволяет оперативно внедрять '
  + 'модули Цифрового двойника',
  c:'#4FE3FF',
};
const ЦЕЛЕВОЙ = {
  k:'Целевой образ',
  t:'Цифровой двойник месторождения',
  s:'Три контура: пласт · скважина · добыча и наземная инфраструктура',
  c:'#9B7BE8',
};

const TAKES = [
  // открывающая подпись: стоит с первого кадра, ждать ей нечего
  { from:0,      to:5.083, ...ПРОГРАММА },

  /* Казахстан проходим без остановки, и зум в область — тоже: три ролика
     подряд одним тактом. Останавливаться на «область только что загорелась»
     нельзя — на этих словах она должна быть уже развёрнута крупно.

     Такт идёт в полтора раза быстрее: шесть секунд ленты укладываются в
     четыре с небольшим. За дорогу от подсвеченной страны до развёрнутой
     области не сказано ничего нового — зритель уже понял, что речь про
     Казахстан, и ждёт, куда именно прилетим. Двойная скорость пробовалась и
     оказалась перебором: подлёт превращался в рывок, и выноска на Молдабек
     выскакивала раньше, чем взгляд успевал дойти до области.

     Расписание внутри такта (`ускорение`) не задействовано: скорость одна на
     весь отрезок. Механизм оставлен — он общий для всех тактов. */
  { from:5.083,  to:11.250, rate:1.4,
    /* Выноска на месторождение: доли кадра замерены по самой ленте — пятно
       выходит на место к 10,9 с и дальше стоит неподвижно до конца такта. */
    метка:{ с:10.9, x:0.721, y:0.460, текст:'Восточный Молдабек' },

    /* Такт проходится не одним нажатием, а четырьмя: Атырау с ЦИО → блок КМГИ →
       панель ИТ-ландшафта → дальше. Речь идёт этими же шагами, и вываливать всё
       разом означало отдать зрителю три мысли одновременно. */
    шаги:['цио','кмги','цепочка'],

    /* Атырау. ЦИО стоит там, а не на промысле: центр развёрнут в Атырау, на
       базе ЭМГ, и ведёт цепочку моделей удалённо. Первая версия вешала карточку
       на выноску Восточного Молдабека — выходило, будто центр стоит в поле.

       Доли сняты с разметки на скриншоте показа. Проверка привязки: выноска
       промысла задана на 0.721 × 0.460 и на том же снимке попадает в
       1384 × 497 из 1920 × 1080, то есть один к одному — поправка не нужна.
       Прежние 0.550 × 0.660 сидели ниже отметки, у самого берега. */
    цио:{ x:0.561, y:0.579, текст:'Атырау · ЦИО' },

    /* Вся текстовая часть — ЦИО и КМГИ — в одной области левее и выше точки
       Атырау. Раньше ЦИО висел прямо над точкой, а КМГИ стоял отдельной панелью
       у левого края кадра: два блока про одно решение оказывались в разных
       углах экрана.

       `y` — НИЖНЯЯ кромка области, а не верхняя, и блоки растут от неё вверх.

const цепь = $('#цепь');
function собратьРазбор(){
  if (цепь.dataset.готово) return;
  цепь.dataset.готово = '1';
  цепь.querySelector('.hd').textContent = ЦЕПЬ.шапка;
  const ряд = цепь.querySelector('.row');
  ряд.textContent = '';

  const свернуть = () => {
    for (const с of ряд.querySelectorAll('.card')) с.classList.remove('открыта');
    ряд.classList.remove('разобрана');
    цепь.classList.remove('разобран');       // выноски на карте возвращаются
  };

  ЦЕПЬ.звенья.forEach((з, i) => {
    if (i){
      const ст = document.createElement('div');
      // стрелка гаснет только за переделом, которого в пилоте нет: у
      // приглушённого, но рабочего поток дальше идёт как обычно
      ст.className = 'ar' + (ЦЕПЬ.звенья[i-1].вне ? ' тусклая' : '');
      ст.textContent = '→';
      ряд.appendChild(ст);
    }
    const к = document.createElement('div');
    /* `серая` — только приглушённый вид, `вне` — передел, которого в пилоте нет.
       Раньше это было одним признаком, и любая приглушённая карточка теряла
       содержимое вместе с цветом. Бурение приглушено, но читается. */
