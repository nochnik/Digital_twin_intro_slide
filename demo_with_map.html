    for (const [кл, тек] of [['no',з.но],['nm',з.имя],['nmк',з.кратко],
                             ['sb',з.под],['sy',з.сис]]){
      const э = document.createElement('div');
      э.className = кл; э.textContent = тек;
      к.appendChild(э);
    }
    if (з.вне){
      const зн = document.createElement('div');
      зн.className = 'знак'; зн.textContent = з.знак;
      к.appendChild(зн);
      const в = document.createElement('div');
      в.className = 'вне'; в.innerHTML = з.вне;
      к.appendChild(в);
    } else {
      const т = document.createElement('div');
      т.className = 'тело';
      const зг = document.createElement('div');
      зг.className = 'зг'; зг.textContent = з.зг;
      т.appendChild(зг);
      const кол = document.createElement('div');
      // в две колонки пускаем только длинные разборы, короткий в них разъезжается
      кол.className = 'кол';
      if (з.группы.length < 3) кол.style.columnCount = 1;
      for (const [имя, пункты] of з.группы){
        const г = document.createElement('div'); г.className = 'гр';
        const н = document.createElement('div'); н.className = 'гн'; н.textContent = имя;
        const сп = document.createElement('ul');
        for (const п of пункты){
          const li = document.createElement('li'); li.textContent = п;
          сп.appendChild(li);
        }
        г.append(н, сп); кол.appendChild(г);
      }
      т.appendChild(кол);
      к.appendChild(т);
      к.addEventListener('click', () => {
        const было = к.classList.contains('открыта');
        свернуть();
        if (было) return;                    // повторное нажатие закрывает
        к.classList.add('открыта');
        ряд.classList.add('разобрана');
        цепь.classList.add('разобран');
      });
    }
    ряд.appendChild(к);
  });

  /* Нажатие мимо карточек складывает разбор обратно в полосу. Уводить показ
     дальше отсюда нельзя — на это есть отдельная кнопка, — а мёртвый клик по
     фону докладчику ничего не даёт: он тычет мимо и не понимает, почему ничего
     не произошло. Складывание — единственное осмысленное действие, которое
     здесь остаётся. */
  цепь.addEventListener('click', e => {
    e.stopPropagation();
    if (e.target.closest('.card') || e.target.closest('.вперёд')) return;
    свернуть();
  });
  цепь.querySelector('.вперёд').addEventListener('click', e => {
    e.stopPropagation();
    финалДальше();
  });
}

/* Страховка на въезд. Браузер приостанавливает переходы, когда кадр не
   отрисовывается, и экран застывал полупрозрачным — тот же случай, что на
   главном экране показа.

   Важно: сначала снять сам переход и только потом проставить конечное
   состояние. Если этого не сделать, присвоение непрозрачности уходит в тот же
   зависший переход и ничего не меняет — на чём я и попался: экран оставался
   на полутоне, сквозь него просвечивал двойник. */
let разборТаймер = 0;
function разборНаЭкран(показать){
  if (показать) собратьРазбор();
  clearTimeout(разборТаймер);
  цепь.style.transition = '';                 // на въезд и съезд отдаём переходу
  цепь.style.opacity = '';
  цепь.classList.toggle('on', показать);
  if (показать) разборТаймер = setTimeout(() => {
    цепь.style.transition = 'none';
    цепь.style.opacity = '1';
  }, 900);
}

/* Собирает один ярус справки: заголовок и строки «ключ — значение». */
function ярусСправки(узел, я){
  узел.textContent = '';
  if (!я) return;
  const ш = document.createElement('div'); ш.className = 'гр';
  ш.textContent = я.шапка;
  узел.appendChild(ш);
  я.строки.forEach(([к, в], i) => {
    const r = document.createElement('div'); r.className = 'rw';
    r.style.transitionDelay = (0.08 + i*0.045) + 's';   // строки проявляются по очереди
    const кк = document.createElement('div'); кк.className = 'k'; кк.textContent = к;
    const вв = document.createElement('div'); вв.className = 'v'; вв.textContent = в;
    r.append(кк, вв);
    узел.appendChild(r);
  });
  if (я.сноска){
    const с = document.createElement('div'); с.className = 'src';
    с.textContent = я.сноска;
    узел.appendChild(с);
  }
}

function собратьСправку(с){
  справка.querySelector('.hd').textContent  = с.шапка;
  справка.querySelector('.nm').textContent  = с.имя;
  справка.querySelector('.sub').textContent = с.под;
  ярусСправки(справка.querySelector('.сделано'), с.сделано);
  ярусСправки(справка.querySelector('.паспорт'), с.паспорт);
}

/* ── отрезок показа ───────────────────────────────────────────────────
   Показ умеет открываться не с начала: `?такт=2` начинает с третьего такта
   («Пилот проекта») и дальше идёт как обычно — до финала, цифр и этапа
   тиражирования. Нужно для коротких выступлений, где вступление и путь от
   страны к пилоту докладчик уже рассказал словами.

   Отдельная ссылка на такой отрезок — `показ_с_пилота.html`: она только
   подставляет параметр, весь показ остаётся одним файлом. Копия показа с
   урезанным списком тактов разошлась бы с оригиналом на первой же правке.

   Назад отрезок не пускает дальше своего начала: за ним лента есть, но в
   рассказе его нет, и уехать туда с клавиатуры было бы обидной случайностью.
   ──────────────────────────────────────────────────────────────────── */
const НАЧАЛО = (() => {
  const п = parseInt(new URLSearchParams(location.search).get('такт'), 10);
  return Number.isFinite(п) ? Math.min(Math.max(п, 0), TAKES.length - 1) : 0;
})();

/* Отрезок ЭМГ обрывается на эффектах: `?тиражирование=0`. Этап тиражирования —
   слово Председателя правления, в часть ЭМГ он не входит, и выкатывать глобус
   после их последней цифры значит отдать им чужой финал. Отдельная ссылка на
   такой отрезок — `pokaz_emg.html`, она только подставляет параметры. */
const БЕЗ_ТИРАЖА = new URLSearchParams(location.search).get('тиражирование') === '0';

/* Подпись первого такта отрезка. Своей у него может не быть: в целом показе на
   этом месте ещё стоит подпись предыдущего такта и держится, пока её не сменит
   титр. Отрезок начинается там, где предыдущего такта нет, поэтому подпись
   берём его — ближайшую назад. Без неё показ открывается кадром промысла, по
   которому не сказано, чей это промысел. */
const ПОДПИСЬ = (() => {
  for (let i = НАЧАЛО; i >= 0; i--) if (TAKES[i].t && !TAKES[i].цепочка) return TAKES[i];
  return null;
})();

TAKES.forEach((_, i) => {
  const д = document.createElement('i');
  if (i < НАЧАЛО) д.style.display = 'none';   // такты до отрезка в шкале не идут
  bar.appendChild(д);
});
const ticks = [...bar.children];

let take = -1;
// idle | play | hold | финал1 (двойник) | финал2 (цифры) | глобус (тиражирование)
let phase = 'idle';
let raf = 0;
let форсаж = false;      // такт доводится ускорением по нажатию — расписание скоростей молчит
let опускается = false;  // идёт возврат панели и кадра, следующий такт ждёт его конца

/* ── титры ───────────────────────────────────────────────────────────── */
/* Подпись принимает любой источник — сам такт или его всплывающий титр.
   Токен отсекает отложенный показ, если такт успели сменить. */
let титрТокен = 0;

function showCap(о){
  // тот же титр уже стоит — не трогаем. Повтор гасит подпись и зажигает заново,
  // и на переходе со стоп-кадра отрезка к ленте это читается как моргание.
  if (о && о.t && cap.dataset.тек === о.t && cap.classList.contains('on')) return;
  cap.classList.remove('on');
  cap.dataset.тек = '';
  титрТокен++;
  if (!о || о.цепочка || !о.t) return;   // панель цепочки или такт без подписи
  const мой = титрТокен;
  cap.dataset.тек = о.t;
  setTimeout(() => {
    if (мой !== титрТокен) return;
    cap.style.setProperty('--cc', о.c);
    cap.querySelector('.k').textContent = о.k || '';
    cap.querySelector('.t').textContent = о.t || '';
    cap.querySelector('.s').textContent = о.s || '';
    cap.classList.add('on');
  }, 200);
}

/* ── панель эффектов ──────────────────────────────────────────────────
   Собирается один раз на такт, выходит справа у самой его границы.
   Блоки всплывают по очереди сверху вниз, как карточки цепочки.
   ──────────────────────────────────────────────────────────────────── */
function собратьЭффекты(э){
  if (effects.dataset.готово === э.шапка) return;
  effects.dataset.готово = э.шапка;
  effects.querySelector('.hd').textContent = э.шапка;

  const тело = effects.querySelector('.body');
  тело.textContent = '';
  э.контуры.forEach(([имя, строки], i) => {
    const к = document.createElement('div');
    к.className = 'ct';
    к.style.transitionDelay = (i * 0.09 + 0.05).toFixed(2) + 's';
    const н = document.createElement('div');
    н.className = 'nm'; н.textContent = имя;
    к.appendChild(н);
    for (const [знач, подпись] of строки){
      const ф = document.createElement('div');
      ф.className = 'fx';
      const v = document.createElement('span'); v.className = 'v'; v.textContent = знач;
      const l = document.createElement('span'); l.className = 'l'; l.textContent = подпись;
      ф.append(v, l);
      к.appendChild(ф);
    }
    тело.appendChild(к);
  });

  const дорога = effects.querySelector('.road');
  дорога.textContent = '';
  э.итоги.forEach(([знач, подпись], i) => {
    const р = document.createElement('div');
    р.className = 'rd';
    р.style.transitionDelay = (i * 0.08 + 0.34).toFixed(2) + 's';
    const v = document.createElement('div'); v.className = 'v'; v.textContent = знач;
    const l = document.createElement('div'); l.className = 'l'; l.textContent = подпись;
    р.append(v, l);
    дорога.appendChild(р);
  });
}

// цифры в финале показываем всегда (переключатель со стартового экрана убран)
const эффектыВключены = () => true;

/* Цифры больше не выходят по ходу последнего такта: сначала докладчик даёт
   зрителю рассмотреть собранный двойник, и только следующим нажатием
   выкатывает эффекты. Поэтому здесь панель всегда убрана — её включает финал. */
function обновитьЭффекты(){ effects.classList.remove('on'); }

/* Подпись, привязанная к моменту внутри такта: выходит по ходу движения и
   не требует остановки — такт при этом доигрывает как обычно. */
/* Три состояния подписи внутри такта: унаследованная от предыдущего, пусто,
   свой титр. Унаследованная уходит по `убрать` и не ждёт смены: она к этому
   времени уже прочитана, а висеть до самого прихода новой значит объяснять
   старым кадром то, что происходит на экране сейчас. Пустая середина такта —
   это и есть дорога: смотреть надо на движение, а не на текст.

   Считаем состояние от времени ленты, а не переключаем событиями: тогда шаг
   назад внутри такта попадает в то же состояние, что и шаг вперёд, сам собой. */
function обновитьТитр(t, время){
  if (!t.титр && t.убрать === undefined) return;
  const свой  = t.титр   && время >= t.титр.с - EPS;
  const снята = t.убрать !== undefined && время >= t.убрать - EPS;
  const нужен = свой ? t.титр : (снята ? null : t);
  if (cap.dataset.тек !== (нужен && нужен.t ? нужен.t : '')) showCap(нужен);
}

function fillTicks(upto){
  ticks.forEach((el, n) => el.style.setProperty('--p', n < upto ? 1 : 0));
}

/* ── сторож границы такта ─────────────────────────────────────────────
   Лента обязана встать ровно на границе. Держать это на requestAnimationFrame
   нельзя: браузер замораживает кадровый цикл, как только вкладка перестаёт
   отрисовываться, — а воспроизведение продолжается, и такт уезжает дальше.
   Проверено: лента проскакивала на десять секунд вперёд.

   Поэтому границу сторожит таймер по остатку времени, подстрахованный
   событием `timeupdate` (оно приходит и в фоне). Кадровый цикл оставлен
   только на шкалу — если он замрёт, показ от этого не сломается.
   ──────────────────────────────────────────────────────────────────── */
let boundary = 0;

/* Скорость на текущем месте такта. Такт может ускоряться по ходу: список
   `ускорение` задаёт, с какой секунды ленты действует новая скорость. */
function скоростьТакта(t, время){
  let r = t.rate || 1;
  for (const [с, скор] of (t.ускорение || [])) if (время >= с - EPS) r = скор;
  return r;
}

/* Ближайшее событие внутри такта: смена скорости, панель цепочки, выноска. */
function следующаяСмена(t, время){
  const когда = [];
  for (const [с] of (t.ускорение || [])) if (с > время + EPS) когда.push(с);
  if (t.метка   && t.метка.с   > время + EPS) когда.push(t.метка.с);
  if (t.титр    && t.титр.с    > время + EPS) когда.push(t.титр.с);
  if (t.убрать !== undefined && t.убрать > время + EPS) когда.push(t.убрать);
  if (t.эффекты && t.эффекты.с > время + EPS) когда.push(t.эффекты.с);
  return когда.length ? Math.min(...когда) : null;
}

/* ── выноска на объект ────────────────────────────────────────────────
   Лента растянута по `object-fit: cover`, поэтому доли кадра нельзя класть
   прямо в проценты экрана: на не-16:9 часть кадра обрезана, и подпись уедет
   от объекта. Считаем фактический прямоугольник ленты и ставим точку в нём.
   ──────────────────────────────────────────────────────────────────── */
/* Ставит любую выноску по долям кадра: и промысел, и точку ЦИО. Раньше функция
   знала только про #mark — с появлением второй точки узел передаётся явно. */
function поставитьМетку(узел, м){
  const вш = innerWidth, вв = innerHeight;
  const кадр = (film.videoWidth || 1920) / (film.videoHeight || 1080);
  let ш, в;
  if (вш / вв > кадр){ ш = вш; в = вш / кадр; }   // упирается в ширину
  else               { в = вв; ш = вв * кадр; }   // упирается в высоту
  // лента может быть поднята под панель — выноска обязана ехать вместе с ней,
  // иначе оторвётся от объекта. Сдвиг задан в процентах от высоты элемента.
  const подъём = film.classList.contains('up') ? вв * 0.10 : 0;
  узел.style.left = ((вш - ш) / 2 + м.x * ш) + 'px';
  узел.style.top  = ((вв - в) / 2 + м.y * в - подъём) + 'px';

  /* Карточку подрезаем по правому краю окна. Точка привязана к кадру, и на
     узком экране карточка в 340 px от неё уезжала за границу. Точку не
     двигаем: она обязана стоять на своём объекте, а сузиться карточке не жалко. */
  const карта = узел.querySelector('.карта');
  if (карта && карта.firstChild){
    const слева = карта.getBoundingClientRect().left;
    карта.style.maxWidth = Math.max(210, вш - слева - 22) + 'px';
  }
}

/* Ставит текстовую область по долям кадра: левый край, ширину и НИЖНЮЮ кромку.
   Привязка снизу принципиальна — блоки выходят по одному, и при привязке по
   верху область росла вниз, к городу, съедая зазор и меняя его на каждом шаге.
   Пиксели тут не годятся: лента растягивается по окну, и блок уехал бы с карты. */
function поставитьИнфо(и){
  const вш = innerWidth, вв = innerHeight;
  const кадр = (film.videoWidth || 1920) / (film.videoHeight || 1080);
  let ш, в;
  if (вш / вв > кадр){ ш = вш; в = вш / кадр; }
  else               { в = вв; ш = вв * кадр; }
  const подъём = film.classList.contains('up') ? вв * 0.10 : 0;
  const низ = (вв - в) / 2 + и.y * в - подъём;
  инфо.style.left   = ((вш - ш) / 2 + и.x * ш) + 'px';
  инфо.style.top    = 'auto';
  инфо.style.bottom = (вв - низ) + 'px';
  инфо.style.width  = (и.w * ш) + 'px';
}

function собратьКарту(к){
  const узел = инфо.querySelector('.карта');
  if (!к){ узел.textContent = ''; узел.dataset.готово = ''; return; }
  if (узел.dataset.готово === к.шапка) return;
  узел.dataset.готово = к.шапка;
  узел.textContent = '';

  const ш = document.createElement('div'); ш.className = 'ш'; ш.textContent = к.шапка;
  узел.appendChild(ш);

  if (к.цепь){
    const ц = document.createElement('div'); ц.className = 'цепь';
    к.цепь.forEach((звено, i) => {
      if (i){ const т = document.createElement('i'); т.textContent = '→'; ц.appendChild(т); }
      const s = document.createElement('span'); s.textContent = звено; ц.appendChild(s);
    });
    узел.appendChild(ц);
  }
  for (const с of (к.строки || [])){
    const д = document.createElement('div'); д.className = 'стр'; д.textContent = с;
    узел.appendChild(д);
  }
}

function обновитьМетку(t, время){
  // выноска промысла — выходит по времени внутри такта
  if (!t.метка) mark.classList.remove('on');
  else {
    mark.querySelector('.tx').textContent = t.метка.текст;
    поставитьМетку(mark, t.метка);
    mark.classList.toggle('on', время >= t.метка.с - EPS);
  }
}

/* ── подшаги такта ────────────────────────────────────────────────────
   Атырау с ЦИО, блок КМГИ и панель ИТ-ландшафта выходят отдельными
   нажатиями — между приближением к области и уходом на следующий такт. Речь
   идёт этими же шагами, и вываливать всё разом значит отдать зрителю три
   мысли одновременно.

   Состояние — одно число: сколько подшагов пройдено. Отсюда и шаг назад: он
   просто уменьшает счётчик, а вид пересобирается целиком, без обратных
   действий на каждый случай.
   ──────────────────────────────────────────────────────────────────── */
let шаг = 0;

function применитьШаги(t){
  const шаги = (t && t.шаги) || [];
  const дошли = имя => шаги.indexOf(имя) >= 0 && шаг > шаги.indexOf(имя);
  const и = t && t.инфо;

  // точка Атырау
  if (!t || !t.цио) cio.classList.remove('on');
  else {
    cio.querySelector('.tx').textContent = t.цио.текст;
    поставитьМетку(cio, t.цио);
    cio.classList.toggle('on', дошли('цио'));
  }

  // карточка ЦИО и блок КМГИ — в одной области кадра, но своими шагами
  if (!и){
    собратьКарту(null); kmgi.classList.remove('on');
    инфо.querySelector('.карта').classList.remove('on');
  } else {
    поставитьИнфо(и);
    собратьКарту(и.цио);
    собратьКМГИ(и.кмги);
    /* С выходом панели ИТ-ландшафта обе модалки уходят: про центр и институт
       сказано, дальше идёт цель 2026 по всей цепочке. Точку Атырау это не
       касается — город остаётся на карте, как и выноска промысла. */
    const ушли = дошли('цепочка');
    инфо.querySelector('.карта').classList.toggle('on', дошли('цио') && !ушли);
    kmgi.classList.toggle('on', дошли('кмги') && !ушли);
  }

  // панель ИТ-ландшафта
  цепочкуНаЭкран(t, дошли('цепочка'));
}

function собратьКМГИ(к){
  if (!к || kmgi.dataset.готово === к.шапка) return;
  kmgi.dataset.готово = к.шапка;
  kmgi.querySelector('.ш').textContent = к.шапка;
  const стрк = kmgi.querySelector('.стрк');
  стрк.textContent = '';
  // строк может не быть вовсе: у КМГИ на экране только сама шапка
  for (const с of (к.строки || [])){
    const д = document.createElement('div'); д.textContent = с;
    стрк.appendChild(д);
  }
}

addEventListener('resize', () => {
  const t = TAKES[take];
  if (t && t.метка && mark.classList.contains('on')) поставитьМетку(mark, t.метка);
  if (t && t.цио  && cio.classList.contains('on')){
    поставитьМетку(cio, t.цио);
    проверитьНакрытие(цепочкаПоднята());   // от размера окна зависит, накрыт ли Атырау
  }
  if (t && t.инфо) поставитьИнфо(t.инфо);
});

/* ── панель цепочки ───────────────────────────────────────────────────
   Собирается один раз на такт и выходит не в его начале, а под конец —
   когда область на ленте уже развёрнута и в кадре есть куда её положить.
   ──────────────────────────────────────────────────────────────────── */
function собратьЦепочку(ц){
  if (chain.dataset.готово === ц.шапка) return;
  chain.dataset.готово = ц.шапка;
  chain.querySelector('.hd').textContent = ц.шапка;
  const ряд = chain.querySelector('.row');
  ряд.textContent = '';
  ц.звенья.forEach(([но, имя, под, сис], i) => {
    if (i){
      const ст = document.createElement('div');
      ст.className = 'ar'; ст.textContent = '→';
      ст.style.transitionDelay = (i * 0.08 + 0.06).toFixed(2) + 's';
      ряд.appendChild(ст);
    }
    const к = document.createElement('div');
    к.className = 'card';
    к.style.transitionDelay = (i * 0.08 + 0.02).toFixed(2) + 's';
    for (const [кл, тек] of [['no',но],['nm',имя],['sb',под],['sy',сис]]){
      const э = document.createElement('div');
      э.className = кл; э.textContent = тек;
      к.appendChild(э);
    }
    ряд.appendChild(к);
  });

  /* Полоса ИТ-ландшафта под цепочкой. Сборка оставлена и отрабатывает, если в
     данные вернуть поле `ландшафт`; сейчас его там нет, и полоса просто не
     показывается. Держим так, а не выпиливаем: блок снят с показа решением по
     содержанию, а не потому, что он сломан. */
  const л = ц.ландшафт, полоса = chain.querySelector('.land');
  полоса.style.display = л ? '' : 'none';
  if (!л) return;
  полоса.querySelector('.hd2').textContent = л.шапка;
  const ряд2 = полоса.querySelector('.row2');
  ряд2.textContent = '';
  л.группы.forEach(([имя, системы], i) => {
    const г = document.createElement('div');
    г.className = 'grp';
    г.style.transitionDelay = (i * 0.07 + 0.30).toFixed(2) + 's';   // после цепочки
    const н = document.createElement('div');
    н.className = 'gn'; н.textContent = имя;
    г.appendChild(н);
    const кор = document.createElement('div');
    кор.className = 'chips';
    for (const с of системы){
      const ч = document.createElement('div');
      ч.className = 'chip' + (/^ABAI/.test(с) ? ' abai' : '');
      ч.textContent = с;
      кор.appendChild(ч);
    }
    г.appendChild(кор);
    ряд2.appendChild(г);
  });
}

/* Панель — отдельный шаг внутри такта, а не событие по времени.
   Такт доигрывает и замирает на чистом кадре области; первое нажатие
   поднимает панель, второе уводит её вниз и сразу переключает такт. */
function цепочкуНаЭкран(t, показать){
  if (!t || !t.цепочка){
    chain.classList.remove('on');
    nudge.style.bottom = '';
    return;
  }
  собратьЦепочку(t.цепочка);
  chain.classList.toggle('on', показать);
  film.classList.toggle('up', показать);      // кадр идёт вместе с панелью
  // выноски и текстовая область обязаны ехать за кадром, иначе оторвутся от
  // своих объектов: кадр под панелью приподнимается
  if (t.метка) поставитьМетку(mark, t.метка);
  if (t.цио)   поставитьМетку(cio, t.цио);
  if (t.инфо)  поставитьИнфо(t.инфо);
  // панель занимает низ экрана — подсказку «дальше» уводим над ней
  nudge.style.bottom = показать ? (chain.offsetHeight + 20) + 'px' : '';
  проверитьНакрытие(показать);
}

/* Атырау скрываем не по факту подъёма панели, а по факту накрытия. На 1080p
   панель ИТ-ландшафта занимает низ кадра и до точки не доходит, а на ноутбучных
   720p занимает почти половину и накрывает её целиком. Правило одно: если
   пересеклись — Атырау уходит, если нет — остаётся на экране вместе с панелью. */
function проверитьНакрытие(панельПоднята){
  if (!панельПоднята || !cio.classList.contains('on')){
    cio.classList.remove('накрыт');
    return;
  }
  // панель едет вверх переходом; её посадочный верх считаем по вёрстке
  const верхПанели = innerHeight - chain.offsetHeight;
  const к = cio.getBoundingClientRect();
  cio.classList.toggle('накрыт', к.bottom > верхПанели);
}

const цепочкаПоднята = () => chain.classList.contains('on');

function armBoundary(){
  clearTimeout(boundary);
  if (phase !== 'play') return;
  const t = TAKES[take];
  const сейчас = film.currentTime;

  const нужнаяСкорость = скоростьТакта(t, сейчас);
  if (Math.abs(film.playbackRate - нужнаяСкорость) > 0.01 && !форсаж)
    film.playbackRate = нужнаяСкорость;
  обновитьМетку(t, сейчас);
  обновитьТитр(t, сейчас);
  обновитьЭффекты(t, сейчас);

  // ждём того, что наступит раньше: смены скорости или конца такта
  const смена = следующаяСмена(t, сейчас);
  const цель = смена !== null ? Math.min(смена, t.to) : t.to;
  const left = (цель - сейчас) / (film.playbackRate || 1);
  boundary = setTimeout(atBoundary, Math.max(0, left * 1000) + 25);
}

function atBoundary(){
  if (phase !== 'play') return;
  const t = TAKES[take];
  if (film.currentTime < t.to - EPS && следующаяСмена(t, film.currentTime) === null
      && Math.abs(film.playbackRate - скоростьТакта(t, film.currentTime)) > 0.01 && !форсаж){
    film.playbackRate = скоростьТакта(t, film.currentTime);
  }
  if (film.currentTime >= t.to - EPS){
    /* Только пауза, без перемотки. Раньше здесь стояло `currentTime = t.to`
       «чтобы ровно на границе» — и давало микрофриз на каждом стыке: любая
       перемотка сбрасывает декодер и заставляет его подниматься с опорного
       кадра. Лента и так стоит на границе с точностью меньше кадра, а
       следующий такт продолжается с этого же места. */
    film.pause();
    ticks[take].style.setProperty('--p', 1);
    // последний такт доигран — показ закончен: цифры выходят сами, лишнего
    // нажатия «в никуда» на границе финала быть не должно
    if (take + 1 >= TAKES.length) finale(); else hold();
  } else {
    armBoundary();                      // ещё не дошли — ждём остаток
  }
}

film.addEventListener('timeupdate', () => {
  if (phase === 'play' && film.currentTime >= TAKES[take].to - EPS) atBoundary();
});

/* шкала — отдельно, её пропажа безобидна */
function watch(idx){
  cancelAnimationFrame(raf);
  const t = TAKES[idx];
  const step = () => {
    if (phase !== 'play' || take !== idx) return;
    const p = (film.currentTime - t.from) / (t.to - t.from);
    ticks[idx].style.setProperty('--p', Math.max(0, Math.min(1, p)));
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

/* ── такт ────────────────────────────────────────────────────────────── */
function playTake(idx, { seek = false, сместа = false } = {}){
  if (idx >= TAKES.length) return finale();
  if (idx < 0) idx = 0;

  const t = TAKES[idx];
  take = idx;
  phase = 'play';
  nudge.classList.remove('on');
  // на первом такте отрезка держим унаследованную подпись: гасить её нечем —
  // такта, который её вёл, в отрезке нет
  showCap(!t.t && idx === НАЧАЛО && ПОДПИСЬ ? ПОДПИСЬ : t);
  fillTicks(idx);

  // Вперёд ничего не перематываем: лента и так стоит на этом кадре.
  // Перемотка только когда прыгаем — назад или на старте. «Сместа» — старт
  // отрезка со стоп-кадра: лента уже стоит где надо, второй прыжок туда же
  // только сбросил бы декодер.
  if (!сместа && (seek || Math.abs(film.currentTime - t.from) > 0.25)) film.currentTime = t.from;

  форсаж = false;
  // на последнем такте поднимаем этап тиражирования: у него двадцать секунд
  // разбега, и к финалу планета уже собрана
  if (idx === TAKES.length - 1) поднятьГлобус();
  // новый такт всегда начинается с нуля подшагов: без Атырау, КМГИ и панели
  шаг = 0; применитьШаги(t);
  film.playbackRate = скоростьТакта(t, film.currentTime);
  // Если данных ещё не хватило, браузер отклоняет play(). Молча проглотить
  // нельзя: показ тогда просто не тронется с места. Ждём готовности и пробуем
  // ещё раз.
  film.play().catch(() => {
    film.addEventListener('canplay', () => {
      if (phase === 'play') film.play().catch(() => {});
      armBoundary();
    }, { once:true });
  });
  armBoundary();
  watch(idx);
}

/* ── пауза на последнем кадре такта ──────────────────────────────────── */
function hold(){
  cancelAnimationFrame(raf);
  clearTimeout(boundary);
  phase = 'hold';
  nudge.classList.add('on');
}

/* ── вперёд ──────────────────────────────────────────────────────────── */
function forward(){
  if (phase === 'перемотка') return;    // идёт отмотка — нажатия ждут её конца
  // Финал идёт своими нажатиями: двойник → цифры → этап тиражирования.
  if (phase === 'финал1' || phase === 'финал2') return финалДальше();
  if (phase === 'цепь') return;         // по экрану нажимают много — уводит только своя кнопка
  // Внутри этапа шаги пробрасываются сообщением в его рамку.
  if (phase === 'глобус') return глобусу({ шаг:+1 });
  if (phase === 'done' || phase === 'idle') return;

  // Нажали посреди такта — доводим его до конца ускорением, а не прыжком:
  // кадр стыка должен остаться тем же.
  if (phase === 'play'){
    const t = TAKES[take], left = t.to - film.currentTime;
    if (left > 0.06){
      форсаж = true;
      film.playbackRate = Math.min(16, Math.max(2, left / 0.3));
      armBoundary();                    // скорость сменилась — пересчитываем остаток
    } else {
      atBoundary();
    }
    return;
  }

  /* Такт с подшагами проходится нажатиями: Атырау с ЦИО, блок КМГИ, панель
     ИТ-ландшафта — и только после последнего идёт следующий такт. Возврат
     панели и кадра доигрывает до конца, прежде чем тронуть ленту: тронь её
     сразу, и сдвиг наложится на воспроизведение, картинка дёрнется. Пока идёт
     возврат, лента стоит на паузе. */
  const т = TAKES[take];
  if (т && т.шаги){
    if (шаг < т.шаги.length){ шаг++; применитьШаги(т); return; }
    if (опускается) return;                 // не даём нажать дважды за возврат
    опускается = true;
    шаг = 0; применитьШаги(т);              // всё снятое уходит одним движением
    setTimeout(() => {
      опускается = false;
      if (take + 1 < TAKES.length) playTake(take + 1);
      else finale();
    }, 560);
    return;
  }

  if (take + 1 < TAKES.length) playTake(take + 1);
  else finale();
}

/* ── перемотка назад ──────────────────────────────────────────────────
   Шаг назад нужен ровно в одном случае: докладчик нажал «далее» лишний раз.
   Прыжком его делать нельзя — картинка меняется мгновенно, и в зале не
   отличить возврат от ухода куда-то ещё. Поэтому лента именно отматывается:
   время гоним назад по кривой с торможением к концу, чтобы было видно, где
   она встала.

   Каждый шаг ждёт `seeked` предыдущего, а не идёт по кадровому циклу. У ленты
   опорный кадр раз в две секунды, и перемотка назад каждый раз поднимает
   декодер заново; давать ему новые цели чаще, чем он успевает, — верный
   способ получить рывки вместо движения. Так цикл сам подстраивается под
   скорость декодера, а конец всё равно приходит по времени.
   ──────────────────────────────────────────────────────────────────── */
let перемотка = null;                   // {шаг, стоп} — идущая отмотка

function оборватьПеремотку(){
  if (!перемотка) return;
  film.removeEventListener('seeked', перемотка.шаг);
  clearTimeout(перемотка.стоп);
  перемотка = null;
}

function перемотатьК(цель, готово){
  оборватьПеремотку();
  clearTimeout(boundary);
  cancelAnimationFrame(raf);
  film.pause();
  цель = Math.max(0, цель);
  const старт = film.currentTime, путь = старт - цель;
  if (путь <= 0.08){ try { film.currentTime = цель; } catch(_){} готово(); return; }

  phase = 'перемотка';                  // сторож границы и нажатия на это время молчат
  форсаж = false;
  nudge.classList.remove('on');
  film.playbackRate = 1;
  const мс = Math.min(900, Math.max(300, путь * 130));
  const t0 = performance.now();

  const финиш = () => {
    оборватьПеремотку();
    try { film.currentTime = цель; } catch(_){}
    /* Фазу снимаем ДО обработчика. Пока висит «перемотка», показ не принимает
       ни одного нажатия, и забудь вызывающий выставить фазу — доклад замер бы
       намертво. `hold` — безопасный минимум: лента стоит, шаг вперёд работает,
       а playTake ниже всё равно переставит на `play`. */
    phase = 'hold';
    готово();
  };
  const шаг = () => {
    const k = Math.min(1, (performance.now() - t0) / мс);
    if (k >= 1){ финиш(); return; }
    const e = 1 - Math.pow(1 - k, 3);    // к концу тормозим — видно, куда встали
    try { film.currentTime = старт - путь * e; } catch(_){}
  };
  // страховка: если очередная цель совпадёт с текущим кадром, `seeked` не
  // придёт и цикл встанет — досрочный выход по времени доводит отмотку
  перемотка = { шаг, стоп: setTimeout(финиш, мс + 500) };
  film.addEventListener('seeked', шаг);
  шаг();
}

/* Назад из финала. Первый шаг — снять цифры и вернуть кадр. Второй — вернуться
   в последний такт, к поднятой панели: именно с неё финал и начался. */
function финалНазад(){
  if (phase === 'финал2'){
    phase = 'цепь';
    effects.classList.remove('on');
    film.classList.remove('влево');
    nudge.classList.remove('on');
    разборНаЭкран(true);
    return;
  }
  if (phase === 'цепь'){
    phase = 'финал1';
    разборНаЭкран(false);
    собратьСправку(СПРАВКА);
    ярусСправки_показать(ЯРУСОВ);       // возвращаемся к раскрытой справке
    nudge.classList.add('on');
    return;
  }
  // внутри финала разбираем ярусы по одному, теми же ступенями, что и вперёд
  // первый ярус — это и есть приход на финал, ниже него ступеней нет
  if (ярусСпр > 1){ ярусСправки_показать(ярусСпр - 1); return; }
  const idx = TAKES.length - 1, т = TAKES[idx];
  take = idx;
  phase = 'hold';
  ярусСправки_показать(0);
  fillTicks(idx);
  $('#skip').style.display = '';
  обновитьТитр(т, film.currentTime);
  обновитьМетку(т, film.currentTime);
  // возвращаемся на последний подшаг такта, а не на его начало
  шаг = (т.шаги || []).length; применитьШаги(т);
  nudge.classList.add('on');
}

/* ── назад ───────────────────────────────────────────────────────────── */
function backward(){
  if (phase === 'idle' || phase === 'перемотка') return;
  // внутри глобуса шаг назад ведёт по его этапам; с первого он сам попросит
  // вернуть показ к цифрам
  if (phase === 'глобус') return глобусу({ шаг:-1 });
  if (phase === 'финал1' || phase === 'финал2' || phase === 'цепь') return финалНазад();
  if (phase === 'done') return;
  /* Пройденные подшаги разбираем в обратном порядке: панель ИТ-ландшафта, блок
     КМГИ, Атырау. Вперёд каждый из них стоит отдельным нажатием, и назад обязан
     сниматься ровно теми же ступенями — иначе одно нажатие назад отменяет три
     нажатия вперёд. */
  if (TAKES[take] && TAKES[take].шаги && шаг > 0){
    шаг--; применитьШаги(TAKES[take]); return;
  }

  /* Один клик — ровно один такт назад, откуда бы ни нажали. Раньше из середины
     такта отмотка вставала в его же начало, и получалось, что «далее» и
     «назад» ходят разным шагом: нажал лишний раз вперёд — назад возвращает не
     туда, откуда ушёл.

     Ниже начала отрезка не уходим: за ним лента есть, но в рассказе его нет. */
  const to = Math.max(НАЧАЛО, take - 1);
  // playTake без seek: лента уже стоит на нужном кадре, второй сброс декодера ни к чему
  перемотатьК(TAKES[to].from, () => playTake(to));
}

/* ── этап тиражирования ───────────────────────────────────────────────
   Последний этап показа — не кадр ленты, а живая сцена three.js: планета,
   подсвеченные области, метки активов. Идёт четвёртым нажатием финала, после
   двойника и цифр. Живёт в своём файле и своём iframe, поднимается заранее
   вместе со слайдом, но тронуться обязан по команде: иначе отъезд от промысла
   отыграет в скрытом кадре и наплыв застанет карту стоящей.

   Клавиатура остаётся одна на весь показ — шаги пробрасываются сообщением, а
   не отдаются фокусу внутри рамки: фокус в iframe теряется от любого клика по
   родителю, и половина нажатий уходила бы в пустоту.
   ──────────────────────────────────────────────────────────────────── */
let глобусГотов = false, глобусЖдётСтарта = false;

function глобусу(что){
  if (globe.contentWindow) globe.contentWindow.postMessage({ глобусу:true, ...что }, '*');
}

function поднятьГлобус(){
  if (!globe.src) globe.src = ГЛОБУС;
}

function показатьГлобус(){
  поднятьГлобус();
  phase = 'глобус';
  effects.classList.remove('on');
  справка.classList.remove('on');           // на случай прихода сюда мимо финала
  film.classList.remove('влево');
  nudge.classList.remove('on');            // подсказку ведёт сам этап
  globe.classList.add('on');
  $('#tov1').style.display = 'inline-flex';   // уход к модели — по кнопке
  if (глобусГотов) глобусу({ старт:true }); else глобусЖдётСтарта = true;
}

/* Возврат с первого шага этапа — обратно к цифрам, то есть в «финал2»:
   лента снова уходит влево, панель эффектов возвращается. */
function спрятатьГлобус(){
  phase = 'финал2';
  globe.classList.remove('on');
  глобусу({ сброс:true });
  film.classList.add('влево');
  const т = TAKES[TAKES.length - 1];
  if (т.эффекты){ собратьЭффекты(т.эффекты); effects.classList.add('on'); }
  nudge.classList.add('on');
  $('#tov1').style.display = 'none';
}

addEventListener('message', e => {
  const д = e.data;
  if (!д || !д.глобус) return;
  if (д.готов){
    глобусГотов = true;
    if (глобусЖдётСтарта){ глобусЖдётСтарта = false; глобусу({ старт:true }); }
  }
  // с первого этапа глобуса шаг назад возвращает показ к цифрам
  if (д.назад && phase === 'глобус') спрятатьГлобус();
});

/* ── финал ────────────────────────────────────────────────────────────
   Слайд поднялся в скрытом iframe ещё на первом такте и всё это время
   рендерил сцену. Лента остаётся на своём последнем кадре, и мы наплываем
   на живую сцену: ни загрузки, ни вспышки, а наплыв заодно съедает
   остаточную разницу между кадром ленты и рендером.

   Финал больше не конец показа: на нём стоят цифры, а следующий шаг уводит
   на этап тиражирования.
   ──────────────────────────────────────────────────────────────────── */
/* Финал идёт нажатиями, а не одним куском:
   1) собранный двойник в кадре, справа — справка по пилоту;
   2) справка сменяется панелью эффектов;
   3) дальше уходит этап тиражирования.
   Раньше цифры выскакивали вместе с последним кадром и перебивали его, а
   первый шаг стоял вовсе без текста. */
function finale(){
  cancelAnimationFrame(raf);
  clearTimeout(boundary);
  phase = 'финал1';
  film.pause();
  fillTicks(TAKES.length);
  cap.classList.remove('on');
  chain.classList.remove('on');
  mark.classList.remove('on');
  film.classList.remove('up');
  effects.classList.remove('on');
  разборНаЭкран(false);                 // на случай прихода сюда кнопкой с разбора
  собратьСправку(СПРАВКА);
  /* Справка выходит сразу с приходом на финал, а не по нажатию: такт закончился
     на контуре актива, и первое, что должно стоять рядом с двойником, — что это
     за актив. Нажатие открывает уже второй ярус, «что уже сделано». */
  ярусСправки_показать(1);
  nudge.classList.add('on');            // подсказка: показ ещё не закончен

  const т = TAKES[TAKES.length - 1];
  const конец = т.to - 0.05;
  if (Math.abs(film.currentTime - конец) > 0.2) { try { film.currentTime = конец; } catch(_){} }

  поднятьГлобус();               // на случай прихода сюда пропуском, а не по ленте
  $('#skip').style.display = 'none';
}

/* ── ярусы справки ────────────────────────────────────────────────────
   Финал стоит на собранном двойнике и раскрывается нажатиями: сначала «что уже
   сделано», потом паспорт месторождения, и только затем эффекты. Панель разом
   выкладывала тринадцать строк — докладчик говорил про сделанное, а зритель в
   это время читал запасы.

   Состояние — одно число: сколько ярусов открыто. Отсюда и шаг назад, он просто
   уменьшает счётчик.
   ──────────────────────────────────────────────────────────────────── */
const ЯРУСОВ = 2;
let ярусСпр = 0;

function ярусСправки_показать(n){
  ярусСпр = Math.max(0, Math.min(ЯРУСОВ, n));
  справка.classList.toggle('on', ярусСпр > 0);
  справка.querySelector('.паспорт').classList.toggle('on', ярусСпр >= 1);
  справка.querySelector('.сделано').classList.toggle('on', ярусСпр >= 2);
}

function финалДальше(){
  if (phase === 'финал1'){
    /* Сначала раскрываем ярусы справки, исчерпав их — уходим на разбор цепочки,
       и только с него к эффектам. Разбор стоит именно здесь: справка сказала,
       что за актив, разбор — что на нём делается по переделам, эффекты — что
       это даёт. Раньше между активом и цифрами не было ничего. */
    if (ярусСпр < ЯРУСОВ){ ярусСправки_показать(ярусСпр + 1); return; }
    phase = 'цепь';
    справка.classList.remove('on');
    nudge.classList.remove('on');       // дальше уводит своя кнопка, подсказка тут лишняя
    разборНаЭкран(true);
    return;
  }
  if (phase === 'цепь'){
    phase = 'финал2';
    разборНаЭкран(false);
    nudge.classList.add('on');
    film.classList.add('влево');
    const т = TAKES[TAKES.length - 1];
    if (т.эффекты){ собратьЭффекты(т.эффекты); effects.classList.add('on'); }
    return;
  }
  if (phase === 'финал2'){
    /* Цифрами показ больше не заканчивается: следующим нажатием выкатывается
       этап тиражирования, а к модели докладчик уходит кнопкой в любой момент.
       Кроме отрезка ЭМГ — там эффекты и есть конец, см. БЕЗ_ТИРАЖА. */
    if (БЕЗ_ТИРАЖА){ nudge.classList.remove('on'); return; }
    показатьГлобус();
  }
}

/* ── управление ──────────────────────────────────────────────────────── */
$('#skip').addEventListener('click', e => { e.stopPropagation(); finale(); });
// «Демо показа v1» уводит на сам слайд, а не разворачивает его внутри показа
$('#tov1').addEventListener('click', e => e.stopPropagation());

addEventListener('keydown', e => {
  if (phase === 'idle' || phase === 'done') return;
  if (phase === 'финал1' || phase === 'финал2' || phase === 'цепь'){
    const c = e.code;
    if (c === 'ArrowRight' || c === 'Enter' || c === 'Space'){ e.preventDefault(); финалДальше(); }
    // назад работает и здесь: лишнее нажатие «далее» на финале ловится так же,
    // как в любом другом месте показа
    if (c === 'ArrowLeft' || c === 'Backspace'){ e.preventDefault(); backward(); }
    return;
  }
  // фаза «глобус» идёт общим путём: шаги внутри неё разбирает forward/backward
  const c = e.code;
  if (c === 'ArrowRight' || c === 'Enter' || c === 'NumpadEnter' ||
      c === 'Space' || c === 'PageDown'){ e.preventDefault(); forward(); }
  if (c === 'ArrowLeft' || c === 'Backspace' || c === 'PageUp'){ e.preventDefault(); backward(); }
  if (c === 'Escape' && phase !== 'глобус') finale();
  if (c === 'KeyF'){
    document.fullscreenElement ? document.exitFullscreen()
                               : document.documentElement.requestFullscreen();
  }
});

/* Клик по родителю ведёт показ до финала включительно. Внутри этапа
   тиражирования клики ловит он сам — до родителя они не доходят, и
   пробрасывать их незачем. */
addEventListener('click', () => {
  // на стоп-кадре отрезка клик в любом месте и есть старт
  if (phase === 'idle'){ if (НАЧАЛО > 0) тронуться(); return; }
  if (phase === 'play' || phase === 'hold' || phase === 'финал1' || phase === 'финал2') forward();
});

/* ── старт ───────────────────────────────────────────────────────────── */
const load = $('#load');

/* ── перемотка под отрезок ────────────────────────────────────────────
   Отрезок начинается перемоткой, а перемотать можно только туда, куда сервер
   даёт заглянуть. Локальный сервер показа Range-запросы игнорирует: на
   `Range: bytes=…` приходит 200 и файл целиком. Браузер тогда не умеет ни
   прыгнуть вперёд, ни докачать про запас — он берёт первые секунды и замирает
   до воспроизведения. Обе беды тихие: `?такт=2` уезжал с нуля, а ожидание
   докачки не кончалось никогда — буфер стоял на 2,5 с.

   Поэтому спрашиваем сервер прямо. Отвечает 206 — перематываем как обычно
   (GitHub Pages отвечает). Отвечает 200 — забираем ленту целиком и подсовываем
   как blob: из памяти перемотка работает всегда. 49 МБ по локальной сети это
   секунда-другая, и она видна строкой «лента готова на N%».

   Показа с начала это не касается вовсе: ему хватает первого кадра. */
/* Пока сервер не ответил, перемотки считаем, что нет. Обратное значение по
   умолчанию давало гонку: лента успевала дойти до readyState раньше ответа, и
   нажатие в это окно уводило показ с нуля — ровно та ошибка, ради которой всё
   это и написано, только реже и оттого хуже. */
let перемоткаЕсть = НАЧАЛО === 0;
const ready = () => film.readyState >= 3 && перемоткаЕсть;

async function лентуВПамять(){
  const о = await fetch(film.src);
  const всего = +о.headers.get('Content-Length') || 0;
  const чтец = о.body.getReader();
  const куски = [];
  let взято = 0;
  for (;;){
    const { done, value } = await чтец.read();
    if (done) break;
    куски.push(value);
    взято += value.length;
    if (всего) load.textContent = 'лента готова на ' + Math.round(взято / всего * 100) + '%';
  }
  film.src = URL.createObjectURL(new Blob(куски, { type:'video/mp4' }));
  перемоткаЕсть = true;
}

async function подготовитьЛенту(){
  if (НАЧАЛО === 0) return;                  // показ с начала идёт без перемотки
  try {
    const о = await fetch(film.src, { headers:{ Range:'bytes=0-99' } });
    о.body?.cancel();                        // сервер мог прислать все 49 МБ
    if (о.status === 206){ перемоткаЕсть = true; return; }   // Range работает
  } catch(_){ /* сеть подведёт — попробуем взять ленту целиком */ }
  try { await лентуВПамять(); }              // при успехе ставит перемотку сама
  catch(_){ перемоткаЕсть = true; }          // не вышло — идём как есть, лучше так, чем стоять
}

film.addEventListener('progress', () => {
  if (!ready() && film.buffered.length){
    const got = film.buffered.end(film.buffered.length - 1);
    load.textContent = 'лента готова на ' + Math.round(got / (film.duration || 49) * 100) + '%';
  } else if (ready()) load.textContent = '';
});

/* Слайд поднимаем сразу, не дожидаясь начала показа: 26 МБ моделей и их
   выгрузка на видеокарту — самая тяжёлая часть, и она должна пройти пока
   докладчик читает вступление, а не под уже играющей лентой. Дальше слайд
   спит в редком рендере до финала. */
slide.src = SLIDE;

// служебный хук: даёт прогнать финал без ожидания ленты
window.__demo = { finale, финалДальше, forward, backward, финалНазад, перемотатьК, playTake, TAKES,
                  обновитьМетку, цепочкуНаЭкран, применитьШаги, hold,
                  get шаг(){ return шаг; }, set шаг(в){ шаг = в; },
                  get фаза(){ return phase; }, get такт(){ return take; } };

/* Показ не должен стартовать на недогруженной ленте: первый такт дёрнется или
   не тронется вовсе. Если данных мало — кнопка честно говорит, что ждём, и
   стартует сама, как только их хватит. */
function убратьЗаставку(){
  const заставка = $('#start');
  заставка.classList.add('gone');
  // страховка: если переход по opacity не отработает, экран всё равно уберётся
  setTimeout(() => { заставка.style.display = 'none'; }, 700);
}

function начать(){
  if (phase !== 'idle') return;        // оба сторожа готовности могут сработать
  убратьЗаставку();
  playTake(НАЧАЛО, { seek:!стопКадрСтоит, сместа:стопКадрСтоит });
}

/* Показ целиком открывается сразу лентой: заставки с кнопкой «начать» там нет —
   на неё уходит время докладчика, а приходят туда уже с модели, осознанно.

   Отрезок сам не трогается: его открывают заранее и посреди разговора, и,
   тронувшись, он отыграл бы промысел в пустоту. Ждёт он стоп-кадром своего
   такта — тем самым кадром, с которого пойдёт рассказ, — а не плашкой поверх
   него. Нажатие в любом месте снимает ленту с паузы.

   Пока лента не готова, на экране только строка ожидания: показать нужный кадр
   всё равно нечем. */
let нажалиСтарт = НАЧАЛО === 0;
let стопКадрСтоит = false;

function лентаГотова(){
  if (!ready() || phase !== 'idle') return;
  if (нажалиСтарт) return начать();
  if (стопКадрСтоит) return;                 // сторожей готовности несколько
  стопКадрСтоит = true;
  убратьЗаставку();
  film.currentTime = TAKES[НАЧАЛО].from;     // кадр границы такта
  film.pause();
  showCap(ПОДПИСЬ);                          // подпись стоит вместе с кадром
  nudge.classList.add('on');                 // «дальше» — приглашение тронуть показ
}

// нажатие до готовности ленты не пропадает: показ тронется, как только сможет
const тронуться = () => { нажалиСтарт = true; лентаГотова(); };

if (НАЧАЛО > 0) addEventListener('keydown', e => {
  if (phase !== 'idle') return;
  const c = e.code;
  if (c === 'ArrowRight' || c === 'Enter' || c === 'NumpadEnter' ||
      c === 'Space' || c === 'PageDown'){ e.preventDefault(); тронуться(); }
});

/* ── вход по адресу: встать на нужный экран без нажатий ───────────────
   `?кадр=панель`   — такт с панелью цепочки, панель поднята;
   `?кадр=финал&шаг=N` — финал после N нажатий: 0 двойник, 1 «что сделано»,
                      2 паспорт актива, 3 разбор цепочки, 4 «Ожидаемые эффекты».
                      `&карточка=M` раскрывает M-ю карточку разбора (с нуля).
   Старые имена держатся как псевдонимы: `финал1` = шаг 2, `финал2` = шаг 4.
   Шаги считаются нажатиями, а не состояниями, — добавится ярус, и перечень
   выше поедет, но сам вход останется верным.
   Работает вместе с `?такт=N`. Нужно для снимков экрана: страницу открывает
   Chrome в фоновом режиме, нажимать там некому. На показ не влияет. */
(function кадрПоАдресу(){
  const п = new URLSearchParams(location.search);
  const что = п.get('кадр') ?? п.get('shot');
  if(!что) return;
  /* Обычный запуск отключаем: иначе лента, догрузившись, стартует сама и
     перебивает выставленный кадр — финал возвращается на первый шаг. */
  нажалиСтарт = false;
  стопКадрСтоит = true;
  const ждать = сколько => new Promise(р => setTimeout(р, сколько));
  const готово = () => film.readyState >= 2;
  (async () => {
    for(let i = 0; i < 120 && !готово(); i++) await ждать(250);
    убратьЗаставку();
    if(что.startsWith('финал')){
      const шагов = что === 'финал1' ? 2 : что === 'финал2' ? 4
                  : Math.max(0, +(п.get('шаг') ?? п.get('step') ?? 0) || 0);
      finale();
      await ждать(1500);
      for(let i = 0; i < шагов; i++){ финалДальше(); await ждать(1200); }
      const карточка = п.get('карточка') ?? п.get('card');
      if(карточка !== null && карточка !== undefined && карточка !== ''){
        const к = цепь.querySelectorAll('.row .card')[+карточка];
        if(к) к.click();
      }
      await ждать(3300);          // ярусам и панели эффектов дать доехать
      return;
    }
    if(что === 'панель'){
      const н = TAKES.findIndex(т => т.цепочка);
      if(н < 0) return;
      film.currentTime = TAKES[н].to - 0.05;
      phase = 'hold'; take = н;
      await ждать(300);
      showCap(TAKES[н]);
      цепочкуНаЭкран(TAKES[н], true);
    }
  })();
})();

$('#load').textContent = 'готовим ленту…';
подготовитьЛенту().then(() => {
  лентаГотова();
  if (phase === 'idle' && !стопКадрСтоит){
    film.addEventListener('canplaythrough', лентаГотова);
    film.addEventListener('canplay', () => setTimeout(лентаГотова, 400), { once:true });
    film.addEventListener('progress', лентаГотова);
  }
});
</script>
</body>
</html>
