<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Демо показа v2 · подводка к цифровому двойнику</title>
<style>
  :root{
    --cyan:#4FE3FF; --amber:#F0AE4A; --teal:#35D0C2; --viol:#9B7BE8;
    --bg0:#050810; --bg1:#0C1626;
    --txt:#D7E2F2; --dim:#7C8DA6; --line:rgba(140,170,210,.22);
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
    --serif:"IBM Plex Serif",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg0);color:var(--txt);overflow:hidden;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}

  /* Одна лента на весь показ. Ни второго слоя, ни подмены источника —
     переключать в кадре нечего, поэтому и мигать нечему. */
  /* Кадр приподнимается вместе с панелью, освобождая карту из-под плиты.
     Двигается только на стоп-кадре, пока лента стоит на паузе: наложение
     сдвига на идущее воспроизведение как раз и давало рывок. */
  #film{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    background:var(--bg0);
    transition:transform .55s cubic-bezier(.22,.61,.36,1)}
  #film.up{transform:translateY(-10%)}
  /* финал: кадр остаётся на месте, панель эффектов ложится поверх правой трети —
     кадр 10 под это и скомпонован, блок в нём уже смещён влево */
  #film.влево{transform:none}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:
      radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(5,8,16,.55) 100%),
      linear-gradient(to top,rgba(5,8,16,.82) 0%,transparent 34%)}

  /* ── титры ───────────────────────────────────────────────────────────── */
  #cap{position:fixed;left:44px;bottom:74px;z-index:6;max-width:46ch;
    opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
  #cap.on{opacity:1;transform:none}
  #cap .k{font-family:var(--mono);font-size:10px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--cc,var(--cyan))}
  #cap .t{font-family:var(--serif);font-size:36px;font-weight:600;
    line-height:1.14;margin-top:8px}
  #cap .s{font-size:14px;color:var(--dim);margin-top:9px;line-height:1.5}

  /* ── панель цепочки создания ценности ─────────────────────────────────
     Такт «Эмбамунайгаз» несёт не подпись из трёх строк, а всю цепочку
     UPSTREAM: пять переделов со своими системами. Полосой внизу во всю
     ширину — иначе на карточки не хватает места.
     ──────────────────────────────────────────────────────────────────── */
  /* Панель лежит на собственной подложке: без неё карточки висели прямо на
     кадре и терялись на светлой карте. Верх подложки уходит в прозрачность,
     чтобы плита не отрезала изображение линейкой.
     Кегли рассчитаны на просмотр с расстояния: прежние 9–11 px читались
     только вплотную к монитору. */
  #chain{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:24px 40px 22px;
    background:linear-gradient(to top,
      rgba(4,7,14,.985) 0%, rgba(4,7,14,.965) 66%,
      rgba(4,7,14,.78) 88%, rgba(4,7,14,0) 100%);
    opacity:0;transform:translateY(100%);
    transition:transform .75s cubic-bezier(.22,.61,.36,1),opacity .4s;
    pointer-events:none}
  #chain.on{opacity:1;transform:none}
  #chain .hd{font-family:var(--mono);font-size:15px;letter-spacing:.22em;
    text-transform:uppercase;color:#9DB4CE;margin-bottom:12px}
  #chain .row{display:flex;align-items:stretch;gap:0}
  /* Карточки собираются по очереди слева направо — цепочка выстраивается,
     а не возникает целиком. */
  #chain .card{flex:1;min-width:0;background:rgba(11,18,30,.94);
    border-top:3px solid var(--amber);padding:15px 18px 16px;
    opacity:0;transform:translateY(14px) scale(.97);filter:blur(3px);
    transition:opacity .45s ease-out,transform .45s ease-out,filter .45s ease-out}
  #chain.on .card{opacity:1;transform:none;filter:none}
  #chain .ar{opacity:0;transition:opacity .3s ease-out}
  #chain.on .ar{opacity:1}
  /* Задержки очерёдности проставляются при сборке, а не селектором: карточки и
     стрелки идут вперемешку и все они div, поэтому nth-of-type попадал мимо. */
  #chain .no{font-family:var(--mono);font-size:16px;color:var(--amber);
    letter-spacing:.12em;opacity:.85}
  #chain .nm{font-size:21px;font-weight:600;color:#F2F7FF;margin-top:9px;
    line-height:1.2;letter-spacing:-.01em}
  #chain .sb{font-family:var(--mono);font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--teal);margin-top:10px;line-height:1.35}
  #chain .sy{font-size:13.5px;color:#B79BF0;margin-top:10px;line-height:1.35}
  #chain .ar{flex:0 0 34px;display:flex;align-items:center;justify-content:center;
    color:#6E839C;font-size:19px}

  /* Под цепочкой — тот же периметр, но глазами ИТ: те же переделы, набитые
     несвязанными системами. Смысл строки в том, что единого слоя между ними
     нет, поэтому системы показаны разрозненными плашками. */
  /* Разделитель отбивает цепочку от ландшафта: это два разных высказывания,
     и без черты они читались как одна каша из плашек. */
  #chain .land{margin-top:16px;padding-top:15px;
    border-top:1px solid rgba(140,170,210,.16)}
  #chain .land .hd2{font-family:var(--mono);font-size:15px;letter-spacing:.22em;
    text-transform:uppercase;color:#9DB4CE;margin-bottom:11px}
  #chain .land .row2{display:flex;gap:26px;align-items:flex-start}
  #chain .grp{flex:1;min-width:0;
    opacity:0;transform:translateY(10px);filter:blur(2px);
    transition:opacity .4s ease-out,transform .4s ease-out,filter .4s ease-out}
  #chain.on .grp{opacity:1;transform:none;filter:none}
  #chain .grp .gn{font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;
    text-transform:uppercase;color:#8296AE;margin-bottom:8px}
  #chain .grp .chips{display:flex;flex-wrap:wrap;gap:6px}
  #chain .chip{font-family:var(--mono);font-size:12.5px;line-height:1;
    padding:6px 9px;border:1px solid rgba(150,180,215,.34);
    color:#C8D8EA;background:rgba(14,25,42,.85);white-space:nowrap}
  #chain .chip.abai{border-color:#4E8FE8;color:#A8CBF6;background:rgba(23,50,92,.85)}

  /* ── эффекты по контурам ──────────────────────────────────────────────
     Стоит справа вертикально: блок изображения занимает левую половину кадра,
     и горизонтальная полоса внизу перекрыла бы сам двойник. Выходит на самом
     финале, когда говорить о цифрах уже уместно.
     ──────────────────────────────────────────────────────────────────── */
  #effects{position:fixed;right:34px;top:5.5%;width:38%;max-height:89%;z-index:6;
    padding:22px 26px 20px;overflow:hidden;
    background:linear-gradient(180deg,rgba(6,11,20,.96),rgba(4,8,15,.985));
    border:1px solid rgba(140,170,210,.16);
    opacity:0;transform:translateX(40px);
    transition:opacity .5s,transform .6s cubic-bezier(.22,.61,.36,1);
    pointer-events:none}
  #effects.on{opacity:1;transform:none}
  #effects .hd{font-family:var(--mono);font-size:13.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--amber);margin-bottom:16px}

  #effects .ct{border-top:2px solid var(--amber);padding:12px 0 14px;
    opacity:0;transform:translateY(10px);
    transition:opacity .4s ease-out,transform .4s ease-out}
  #effects.on .ct{opacity:1;transform:none}
  #effects .ct .nm{font-family:var(--mono);font-size:14px;letter-spacing:.1em;
    text-transform:uppercase;color:#F2F7FF;font-weight:600}
  #effects .fx{display:flex;align-items:baseline;gap:10px;margin-top:9px}
  #effects .fx .v{font-family:var(--mono);font-size:27px;color:var(--teal);
    line-height:1;flex:0 0 auto}
  #effects .fx .l{font-size:14px;color:#9DB4CE;line-height:1.3}

  /* Дорожная карта отделена: это уже не эффект, а сроки */
  #effects .road{margin-top:16px;padding-top:16px;
    border-top:1px solid rgba(140,170,210,.16)}
  #effects .rd{border-left:2px solid var(--cyan);padding:2px 0 2px 12px;
    margin-bottom:12px;
    opacity:0;transform:translateY(10px);
    transition:opacity .4s ease-out,transform .4s ease-out}
  #effects.on .rd{opacity:1;transform:none}
  #effects .rd .v{font-family:var(--mono);font-size:19px;color:#EAF2FF;line-height:1.1}
  #effects .rd .l{font-size:13px;color:#8296AE;margin-top:4px;line-height:1.3}

  /* ── выноска на объект в кадре ────────────────────────────────────────
     Подпись привязана к точке самой ленты, а не к углу экрана: иначе на
     другом соотношении сторон она уедет от объекта. Координаты считаются
     от фактического положения кадра под object-fit: cover.
     ──────────────────────────────────────────────────────────────────── */
  /* Сдвиг ровно на половину кружка: на точку садится он, а линия с подписью
     уходят вправо. Центрировать всю выноску нельзя — её тянет текст. */
  #mark{position:fixed;z-index:6;display:flex;align-items:center;
    opacity:0;pointer-events:none;transform:translate(-17px,-50%);
    transition:opacity .5s, top .75s cubic-bezier(.22,.61,.36,1)}
  #mark.on{opacity:1}
  #mark .dot{width:34px;height:34px;border:2px solid var(--cyan);border-radius:50%;
    box-shadow:0 0 14px rgba(79,227,255,.75), inset 0 0 10px rgba(79,227,255,.35);
    flex:0 0 auto;animation:пульс 2.4s ease-in-out infinite}
  @keyframes пульс{0%,100%{transform:scale(1);opacity:.85}
                   50%{transform:scale(1.14);opacity:1}}
  #mark .ln{width:52px;height:1px;background:linear-gradient(90deg,
    rgba(79,227,255,.9),rgba(79,227,255,.25));flex:0 0 auto}
  #mark .tx{font-family:var(--mono);font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:#EAF2FF;white-space:nowrap;
    background:rgba(8,14,26,.82);border-left:2px solid var(--cyan);
    padding:6px 10px;backdrop-filter:blur(6px)}

  /* ── приглашение к следующему такту ──────────────────────────────────── */
  #go-next{position:fixed;right:44px;bottom:74px;z-index:6;display:flex;
    align-items:center;gap:11px;font-family:var(--mono);font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    opacity:0;transition:opacity .4s;pointer-events:none}
  #go-next.on{opacity:1}
  #go-next .a{font-size:17px;line-height:1;color:var(--cyan);
    animation:nudge 1.7s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0);opacity:.55}
                   50%{transform:translateX(5px);opacity:1}}

  /* ── шкала тактов ────────────────────────────────────────────────────── */
  #bar{position:fixed;left:0;right:0;bottom:0;height:2px;z-index:7;
    background:rgba(140,170,210,.14);display:flex;gap:2px;padding:0 2px}
  #bar i{flex:1;background:rgba(140,170,210,.14);position:relative;overflow:hidden}
  #bar i::after{content:'';position:absolute;inset:0;background:var(--cyan);
    transform:scaleX(var(--p,0));transform-origin:left;transition:transform .1s linear}

  /* ── кнопки, в стиле слайда ──────────────────────────────────────────── */
  .btn{position:fixed;z-index:8;display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:8px 13px;
    background:rgba(10,18,32,.45);backdrop-filter:blur(6px);opacity:.42;cursor:pointer;
    transition:opacity .25s,color .25s,border-color .25s,background .25s}
  .btn:hover,.btn:focus-visible{opacity:1;color:var(--cyan);border-color:var(--cyan);
    background:rgba(79,227,255,.08);outline:none}
  /* Справа сверху сменяются две кнопки на одном месте: пока идёт подводка —
     «пропустить», после неё, на модели, — уход на отдельный слайд. Вторая
     живёт поверх модели, поэтому слой выше iframe. */
  #skip{right:26px;top:20px}
  #tov1{right:26px;top:20px;z-index:18;display:none}

  /* ── стартовый экран ─────────────────────────────────────────────────── */
  #start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;text-align:center;
    background:radial-gradient(ellipse at 50% 34%,#0C1626 0%,#050810 72%);
    transition:opacity .7s}
  #start.gone{opacity:0;pointer-events:none}
  #start .k{font-family:var(--mono);font-size:10px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--cyan)}
  #start h1{font-family:var(--serif);font-size:40px;font-weight:600;margin:0;line-height:1.2}
  #start p{margin:0;color:var(--dim);max-width:52ch;line-height:1.6}
  #go{margin-top:10px;position:static;opacity:1;color:var(--txt);
    border-color:var(--cyan);padding:13px 26px;font-size:11px}
  #go:hover{background:rgba(79,227,255,.12)}
  #start .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);margin-top:26px;line-height:1.9}
  #start .load{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);opacity:.7;height:12px}

  /* Переключатель финальной панели: на части показов цифры называет докладчик,
     и выводить их на экран не нужно. Решение принимается до старта. */
  #fx-sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);user-select:none;
    transition:color .25s}
  #fx-sw:hover{color:#B9CBE2}
  #fx-sw input{position:absolute;opacity:0;pointer-events:none}
  #fx-sw .sw{width:34px;height:18px;border:1px solid var(--line);
    background:rgba(10,18,32,.6);position:relative;flex:0 0 auto;
    transition:border-color .25s,background .25s}
  #fx-sw .sw::after{content:'';position:absolute;top:2px;left:2px;
    width:12px;height:12px;background:var(--dim);
    transition:transform .25s,background .25s}
  #fx-sw input:checked + .sw{border-color:var(--cyan);background:rgba(79,227,255,.12)}
  #fx-sw input:checked + .sw::after{transform:translateX(16px);background:var(--cyan)}
  #fx-sw input:focus-visible + .sw{outline:1px solid var(--cyan);outline-offset:2px}

  /* ── живой слайд: грузится под лентой с начала показа ────────────────── */
  #slide{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:15;
    opacity:0;pointer-events:none;transition:opacity .9s ease-in}
  #slide.on{opacity:1;pointer-events:auto}

  /* ── этап тиражирования: планета с областями, после финала ────────────
     Тоже <iframe>, тоже поднимается заранее — но слоем выше слайда и ниже
     кнопки «3д модель», чтобы она осталась нажимаемой поверх глобуса. */
  #globe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:16;
    opacity:0;pointer-events:none;transition:opacity .9s ease-in}
  #globe.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>

<video id="film" muted playsinline preload="auto"
       poster="переход/постер.jpg"
       src="переход/подводка.mp4"></video>
<div id="vig"></div>

<div id="cap"><div class="k"></div><div class="t"></div><div class="s"></div></div>
<div id="chain">
  <div class="hd"></div><div class="row"></div>
  <div class="land"><div class="hd2"></div><div class="row2"></div></div>
</div>
<div id="mark"><span class="dot"></span><span class="ln"></span><span class="tx"></span></div>
<div id="effects"><div class="hd"></div><div class="body"></div><div class="road"></div></div>
<div id="go-next"><span>дальше</span><span class="a">→</span></div>
<div id="bar"></div>

<button class="btn" id="skip">пропустить<span>→</span></button>
<a class="btn" id="tov1" href="первый_слайд_v3.html">3д модель<span>→</span></a>

<div id="start">
  <div class="load" id="load"></div>
</div>

<iframe id="slide" title="Цифровой двойник — первый слайд"></iframe>
<iframe id="globe" title="Тиражирование цифрового двойника"></iframe>

<script>
/* ────────────────────────────────────────────────────────────────────────
   Подводка — одна непрерывная лента `переход/подводка.mp4`. Такт это не
   отдельный файл, а отрезок внутри неё.

   Почему так. Пока такты были девятью файлами, каждое переключение меняло
   источник картинки, и на стыке проскакивал кадр чужого состояния. Здесь
   переключать нечего: шаг вперёд — это просто снятие паузы, лента идёт
   дальше с того же кадра, на котором стояла. Ни перемотки, ни подгрузки.

   Шаг назад — единственное место, где перемотка нужна. Лента собрана с
   опорными кадрами ровно на границах тактов (`-force_key_frames`), поэтому
   перемотка попадает в границу, а не в ближайший опорный кадр в стороне.

   Границы взяты по факту из готового файла, а не из задуманных значений:
   кодировщик ставит опорный кадр в ближайший кадр сетки, расхождение до
   1/24 секунды.
   ──────────────────────────────────────────────────────────────────────── */

const TAKES = [
  { from:0,      to:5.083,
    k:'Программа «Цифровой двойник» · целевой образ',
    t:'Цифровой двойник на базе ИС ABAI',
    s:'Интеллектуальная виртуальная копия производственных объектов реального мира, '
     +'связанных по цепочке «пласт — скважина — добыча и наземная инфраструктура»',
    c:'#4FE3FF' },

  /* Казахстан проходим без остановки, и зум в область — тоже: три ролика
     подряд одним тактом. Останавливаться на «область только что загорелась»
     нельзя — на этих словах она должна быть уже развёрнута крупно.

     Скорость внутри такта меняется: подлёт к стране идёт в полтора раза
     быстрее обычного, а загорание области и зум в неё — вдвое. Отдельными
     тактами это не сделать, там вернулась бы пауза посреди движения. */
  { from:5.083,  to:11.250,
    /* Выноска на месторождение: доли кадра замерены по самой ленте — пятно
       выходит на место к 10,9 с и дальше стоит неподвижно до конца такта. */
    метка:{ с:10.9, x:0.721, y:0.460, текст:'Восточный Молдабек' },
    цепочка:{
      с:9.9,                        // выходит под конец такта, когда область уже развёрнута
      шапка:'Цепочка создания ценности UPSTREAM',
      звенья:[
        ['01','Геология и геологоразведка','коммерчески извлекаемые запасы','t-Navigator, Petrel'],
        ['02','Разработка месторождений','стратегия разработки','ABAI ЦРНС 2.0'],
        ['03','Бурение и ВСР','ввод новых мощностей','ABAI Цифровое бурение'],
        ['04','Добыча','управление добычей','ABAI Планирование добычи и мониторинг 2.0'],
        ['05','КС и наземная инфраструктура','проектирование новых мощностей','ABAI Наземная инфраструктура'],
      ],
      ландшафт:{
        шапка:'Инженерный ИТ-ландшафт',
        группы:[
          ['Геология и ГРР',        ['Petrel','Techlog','tNavigator','PVTi','PVTSim','Kingdom',
                                     'Hampson Russel','ABAI (БД)']],
          ['Разработка',            ['Petrel','tNavigator','Eclipse','OFM','ABAI (УЗ)','ABAI (ТР)',

                                     'SAP ERP','СЭД','ABAI (БД, ПГНО, ПДИМ)']],
          ['Добыча',                ['UniSim','СДМО','ИСУТО','ИМ','АСКУЭ','АСТУЭ',
                                     'SCADA','SAP ERP','Procu','ABAI (БД)']],
        ],
      },
    },
    c:'#F0AE4A' },

  /* От пилотного актива до блока двойника — один непрерывный прогон без

  { from:11.250, to:16.458,

     по ходу, на блоке двойника, и дальше держится до самого финала. */
  /* Последний прогон длинный — двадцать секунд одного движения. Идёт в
     полтора раза быстрее: разглядывать там нечего, а пауза докладчика

  { from:16.458, to:37.10, rate:1.5,
    титр:{ с:31.917,
      k:'Целевой образ',
      t:'Цифровой двойник месторождения',
      s:'Три контура: пласт · скважина · добыча и наземная инфраструктура',
      c:'#9B7BE8' },
    /* Цифры выходят последними, у самой границы такта: сначала зритель видит
       собранный двойник, и только потом — что он даёт. */
    эффекты:{ с:36.7,
      шапка:'Ожидаемые эффекты по контурам',
      контуры:[
        ['ЦД пласта',   [['−5%','снижение CAPEX']]],
        ['ЦД скважины', [['−3%','сроки вывода на режим']]],
        ['ЦД добычи и наземной инфраструктуры',
                        [['−5%','управляемые потери добычи'],
                         ['−3%','CAPEX/OPEX инфраструктуры']]],
      ],
      итоги:[
        // Про тиражирование панель больше не говорит: сроки по ТОП-12 и охвату
        // ушли на этап тиражирования, где под них есть карта.
        ['окт. 2026', 'промышленная эксплуатация пилота Молдабек В.'],

const SLIDE = 'первый_слайд_v3.html';
const ГЛОБУС = 'тиражирование.html';
const EPS = 0.03;                       // допуск сравнения времени, меньше кадра

const $ = s => document.querySelector(s);
const film = $('#film'), cap = $('#cap'), bar = $('#bar'),
      slide = $('#slide'), nudge = $('#go-next'), chain = $('#chain'), mark = $('#mark'), effects = $('#effects'),
      globe = $('#globe');

TAKES.forEach(() => bar.appendChild(document.createElement('i')));
const ticks = [...bar.children];

let take = -1;
// idle | play | hold | финал1 (двойник) | финал2 (цифры) | глобус (тиражирование)
let phase = 'idle';
let raf = 0;
let форсаж = false;      // такт доводится ускорением по нажатию — расписание скоростей молчит
let опускается = false;  // идёт возврат панели и кадра, следующий такт ждёт его конца

/* ── титры ───────────────────────────────────────────────────────────── */
/* Подпись принимает любой источник — сам такт или его всплывающий титр.
   Токен отсекает отложенный показ, если такт успели сменить. */
let титрТокен = 0;

function showCap(о){
  cap.classList.remove('on');
  cap.dataset.тек = '';
  титрТокен++;
  if (!о || о.цепочка || !о.t) return;   // панель цепочки или такт без подписи
  const мой = титрТокен;
  cap.dataset.тек = о.t;
  setTimeout(() => {
    if (мой !== титрТокен) return;
    cap.style.setProperty('--cc', о.c);
    cap.querySelector('.k').textContent = о.k || '';
    cap.querySelector('.t').textContent = о.t || '';
    cap.querySelector('.s').textContent = о.s || '';
    cap.classList.add('on');
  }, 200);
}

/* ── панель эффектов ──────────────────────────────────────────────────
   Собирается один раз на такт, выходит справа у самой его границы.
   Блоки всплывают по очереди сверху вниз, как карточки цепочки.
   ──────────────────────────────────────────────────────────────────── */
function собратьЭффекты(э){
  if (effects.dataset.готово === э.шапка) return;
  effects.dataset.готово = э.шапка;
  effects.querySelector('.hd').textContent = э.шапка;

  const тело = effects.querySelector('.body');
  тело.textContent = '';
  э.контуры.forEach(([имя, строки], i) => {
    const к = document.createElement('div');
    к.className = 'ct';
    к.style.transitionDelay = (i * 0.09 + 0.05).toFixed(2) + 's';
    const н = document.createElement('div');
    н.className = 'nm'; н.textContent = имя;
    к.appendChild(н);
    for (const [знач, подпись] of строки){
      const ф = document.createElement('div');
      ф.className = 'fx';
      const v = document.createElement('span'); v.className = 'v'; v.textContent = знач;
      const l = document.createElement('span'); l.className = 'l'; l.textContent = подпись;
      ф.append(v, l);
      к.appendChild(ф);
    }
    тело.appendChild(к);
  });

  const дорога = effects.querySelector('.road');
  дорога.textContent = '';
  э.итоги.forEach(([знач, подпись], i) => {
    const р = document.createElement('div');
    р.className = 'rd';
    р.style.transitionDelay = (i * 0.08 + 0.34).toFixed(2) + 's';
    const v = document.createElement('div'); v.className = 'v'; v.textContent = знач;
    const l = document.createElement('div'); l.className = 'l'; l.textContent = подпись;
    р.append(v, l);
    дорога.appendChild(р);
  });
}

// цифры в финале показываем всегда (переключатель со стартового экрана убран)
const эффектыВключены = () => true;

/* Цифры больше не выходят по ходу последнего такта: сначала докладчик даёт
   зрителю рассмотреть собранный двойник, и только следующим нажатием
   выкатывает эффекты. Поэтому здесь панель всегда убрана — её включает финал. */
function обновитьЭффекты(){ effects.classList.remove('on'); }

/* Подпись, привязанная к моменту внутри такта: выходит по ходу движения и
   не требует остановки — такт при этом доигрывает как обычно. */
function обновитьТитр(t, время){
  if (!t.титр) return;
  const пора = время >= t.титр.с - EPS;
  if (пора  && cap.dataset.тек !== t.титр.t) showCap(t.титр);
  if (!пора && cap.dataset.тек === t.титр.t) showCap(null);
}

function fillTicks(upto){
  ticks.forEach((el, n) => el.style.setProperty('--p', n < upto ? 1 : 0));
}

/* ── сторож границы такта ─────────────────────────────────────────────
   Лента обязана встать ровно на границе. Держать это на requestAnimationFrame
   нельзя: браузер замораживает кадровый цикл, как только вкладка перестаёт
   отрисовываться, — а воспроизведение продолжается, и такт уезжает дальше.
   Проверено: лента проскакивала на десять секунд вперёд.

   Поэтому границу сторожит таймер по остатку времени, подстрахованный
   событием `timeupdate` (оно приходит и в фоне). Кадровый цикл оставлен
   только на шкалу — если он замрёт, показ от этого не сломается.
   ──────────────────────────────────────────────────────────────────── */
let boundary = 0;

/* Скорость на текущем месте такта. Такт может ускоряться по ходу: список
   `ускорение` задаёт, с какой секунды ленты действует новая скорость. */
function скоростьТакта(t, время){
  let r = t.rate || 1;
  for (const [с, скор] of (t.ускорение || [])) if (время >= с - EPS) r = скор;
  return r;
}

/* Ближайшее событие внутри такта: смена скорости, панель цепочки, выноска. */
function следующаяСмена(t, время){
  const когда = [];
  for (const [с] of (t.ускорение || [])) if (с > время + EPS) когда.push(с);
  if (t.метка   && t.метка.с   > время + EPS) когда.push(t.метка.с);
  if (t.титр    && t.титр.с    > время + EPS) когда.push(t.титр.с);
  if (t.эффекты && t.эффекты.с > время + EPS) когда.push(t.эффекты.с);
  return когда.length ? Math.min(...когда) : null;
}

/* ── выноска на объект ────────────────────────────────────────────────
   Лента растянута по `object-fit: cover`, поэтому доли кадра нельзя класть
   прямо в проценты экрана: на не-16:9 часть кадра обрезана, и подпись уедет
   от объекта. Считаем фактический прямоугольник ленты и ставим точку в нём.
   ──────────────────────────────────────────────────────────────────── */
function поставитьМетку(м){
  const вш = innerWidth, вв = innerHeight;
  const кадр = (film.videoWidth || 1920) / (film.videoHeight || 1080);
  let ш, в;
  if (вш / вв > кадр){ ш = вш; в = вш / кадр; }   // упирается в ширину
  else               { в = вв; ш = вв * кадр; }   // упирается в высоту
  // лента может быть поднята под панель — выноска обязана ехать вместе с ней,
  // иначе оторвётся от объекта. Сдвиг задан в процентах от высоты элемента.
  const подъём = film.classList.contains('up') ? вв * 0.10 : 0;
  mark.style.left = ((вш - ш) / 2 + м.x * ш) + 'px';
  mark.style.top  = ((вв - в) / 2 + м.y * в - подъём) + 'px';
}

function обновитьМетку(t, время){
  if (!t.метка){ mark.classList.remove('on'); return; }
  mark.querySelector('.tx').textContent = t.метка.текст;
  поставитьМетку(t.метка);
  mark.classList.toggle('on', время >= t.метка.с - EPS);
}

addEventListener('resize', () => {
  const t = TAKES[take];
  if (t && t.метка && mark.classList.contains('on')) поставитьМетку(t.метка);
});

/* ── панель цепочки ───────────────────────────────────────────────────
   Собирается один раз на такт и выходит не в его начале, а под конец —
   когда область на ленте уже развёрнута и в кадре есть куда её положить.
   ──────────────────────────────────────────────────────────────────── */
function собратьЦепочку(ц){
  if (chain.dataset.готово === ц.шапка) return;
  chain.dataset.готово = ц.шапка;
  chain.querySelector('.hd').textContent = ц.шапка;
  const ряд = chain.querySelector('.row');
  ряд.textContent = '';
  ц.звенья.forEach(([но, имя, под, сис], i) => {
    if (i){
      const ст = document.createElement('div');
      ст.className = 'ar'; ст.textContent = '→';
      ст.style.transitionDelay = (i * 0.08 + 0.06).toFixed(2) + 's';
      ряд.appendChild(ст);
    }
    const к = document.createElement('div');
    к.className = 'card';
    к.style.transitionDelay = (i * 0.08 + 0.02).toFixed(2) + 's';
    for (const [кл, тек] of [['no',но],['nm',имя],['sb',под],['sy',сис]]){
      const э = document.createElement('div');
      э.className = кл; э.textContent = тек;
      к.appendChild(э);
    }
    ряд.appendChild(к);
  });

  // ИТ-ландшафт под цепочкой: те же переделы, набитые несвязанными системами
  const л = ц.ландшафт, полоса = chain.querySelector('.land');
  полоса.style.display = л ? '' : 'none';
  if (!л) return;
  полоса.querySelector('.hd2').textContent = л.шапка;
  const ряд2 = полоса.querySelector('.row2');
  ряд2.textContent = '';
  л.группы.forEach(([имя, системы], i) => {
    const г = document.createElement('div');
    г.className = 'grp';
    г.style.transitionDelay = (i * 0.07 + 0.30).toFixed(2) + 's';   // после цепочки
    const н = document.createElement('div');
    н.className = 'gn'; н.textContent = имя;
    г.appendChild(н);
    const кор = document.createElement('div');
    кор.className = 'chips';
    for (const с of системы){
      const ч = document.createElement('div');
      ч.className = 'chip' + (/^ABAI/.test(с) ? ' abai' : '');
      ч.textContent = с;
      кор.appendChild(ч);
    }
    г.appendChild(кор);
    ряд2.appendChild(г);
  });
}

/* Панель — отдельный шаг внутри такта, а не событие по времени.
   Такт доигрывает и замирает на чистом кадре области; первое нажатие
   поднимает панель, второе уводит её вниз и сразу переключает такт. */
function цепочкуНаЭкран(t, показать){
  if (!t || !t.цепочка){
    chain.classList.remove('on');
    nudge.style.bottom = '';
    return;
  }
  собратьЦепочку(t.цепочка);
  chain.classList.toggle('on', показать);
  film.classList.toggle('up', показать);      // кадр идёт вместе с панелью
  if (t.метка) поставитьМетку(t.метка);       // выноска обязана ехать за кадром
  // панель занимает низ экрана — подсказку «дальше» уводим над ней
  nudge.style.bottom = показать ? (chain.offsetHeight + 20) + 'px' : '';
}

const цепочкаПоднята = () => chain.classList.contains('on');

function armBoundary(){
  clearTimeout(boundary);
  if (phase !== 'play') return;
  const t = TAKES[take];
  const сейчас = film.currentTime;

  const нужнаяСкорость = скоростьТакта(t, сейчас);
  if (Math.abs(film.playbackRate - нужнаяСкорость) > 0.01 && !форсаж)
    film.playbackRate = нужнаяСкорость;
  обновитьМетку(t, сейчас);
  обновитьТитр(t, сейчас);
  обновитьЭффекты(t, сейчас);

  // ждём того, что наступит раньше: смены скорости или конца такта
  const смена = следующаяСмена(t, сейчас);
  const цель = смена !== null ? Math.min(смена, t.to) : t.to;
  const left = (цель - сейчас) / (film.playbackRate || 1);
  boundary = setTimeout(atBoundary, Math.max(0, left * 1000) + 25);
}

function atBoundary(){
  if (phase !== 'play') return;
  const t = TAKES[take];
  if (film.currentTime < t.to - EPS && следующаяСмена(t, film.currentTime) === null
      && Math.abs(film.playbackRate - скоростьТакта(t, film.currentTime)) > 0.01 && !форсаж){
    film.playbackRate = скоростьТакта(t, film.currentTime);
  }
  if (film.currentTime >= t.to - EPS){
    /* Только пауза, без перемотки. Раньше здесь стояло `currentTime = t.to`
       «чтобы ровно на границе» — и давало микрофриз на каждом стыке: любая
       перемотка сбрасывает декодер и заставляет его подниматься с опорного
       кадра. Лента и так стоит на границе с точностью меньше кадра, а
       следующий такт продолжается с этого же места. */
    film.pause();
    ticks[take].style.setProperty('--p', 1);
    // последний такт доигран — показ закончен: цифры выходят сами, лишнего
    // нажатия «в никуда» на границе финала быть не должно
    if (take + 1 >= TAKES.length) finale(); else hold();
  } else {
    armBoundary();                      // ещё не дошли — ждём остаток
  }
}

film.addEventListener('timeupdate', () => {
  if (phase === 'play' && film.currentTime >= TAKES[take].to - EPS) atBoundary();
});

/* шкала — отдельно, её пропажа безобидна */
function watch(idx){
  cancelAnimationFrame(raf);
  const t = TAKES[idx];
  const step = () => {
    if (phase !== 'play' || take !== idx) return;
    const p = (film.currentTime - t.from) / (t.to - t.from);
    ticks[idx].style.setProperty('--p', Math.max(0, Math.min(1, p)));
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

/* ── такт ────────────────────────────────────────────────────────────── */
function playTake(idx, { seek = false } = {}){
  if (idx >= TAKES.length) return finale();
  if (idx < 0) idx = 0;

  const t = TAKES[idx];
  take = idx;
  phase = 'play';
  nudge.classList.remove('on');
  showCap(t);
  fillTicks(idx);

  // Вперёд ничего не перематываем: лента и так стоит на этом кадре.
  // Перемотка только когда прыгаем — назад или на старте.
  if (seek || Math.abs(film.currentTime - t.from) > 0.25) film.currentTime = t.from;

  форсаж = false;
  // на последнем такте поднимаем этап тиражирования: у него двадцать секунд
  // разбега, и к финалу планета уже собрана
  if (idx === TAKES.length - 1) поднятьГлобус();
  цепочкуНаЭкран(t, false);       // новый такт всегда начинается без панели
  film.playbackRate = скоростьТакта(t, film.currentTime);
  // Если данных ещё не хватило, браузер отклоняет play(). Молча проглотить
  // нельзя: показ тогда просто не тронется с места. Ждём готовности и пробуем
  // ещё раз.
  film.play().catch(() => {
    film.addEventListener('canplay', () => {
      if (phase === 'play') film.play().catch(() => {});
      armBoundary();
    }, { once:true });
  });
  armBoundary();
  watch(idx);
}

/* ── пауза на последнем кадре такта ──────────────────────────────────── */
function hold(){
  cancelAnimationFrame(raf);
  clearTimeout(boundary);
  phase = 'hold';
  nudge.classList.add('on');
}

/* ── вперёд ──────────────────────────────────────────────────────────── */
function forward(){
  // Финал идёт своими нажатиями: двойник → цифры → этап тиражирования.
  if (phase === 'финал1' || phase === 'финал2') return финалДальше();
  // Внутри этапа шаги пробрасываются сообщением в его рамку.
  if (phase === 'глобус') return глобусу({ шаг:+1 });
  if (phase === 'done' || phase === 'idle') return;

  // Нажали посреди такта — доводим его до конца ускорением, а не прыжком:
  // кадр стыка должен остаться тем же.
  if (phase === 'play'){
    const t = TAKES[take], left = t.to - film.currentTime;
    if (left > 0.06){
      форсаж = true;
      film.playbackRate = Math.min(16, Math.max(2, left / 0.3));
      armBoundary();                    // скорость сменилась — пересчитываем остаток
    } else {
      atBoundary();
    }
    return;
  }

  /* Такт с панелью проходится в два нажатия. Первое — область стоит чистой,
     панель поднимается снизу и приподнимает кадр. Второе — панель с кадром
     возвращаются, и только по завершении этого движения идёт следующий такт:
     если тронуть ленту сразу, сдвиг наложится на воспроизведение и картинка
     дёрнется. Пока идёт возврат, лента стоит на паузе. */
  const т = TAKES[take];
  if (т && т.цепочка){
    if (!цепочкаПоднята()){ цепочкуНаЭкран(т, true); return; }
    if (опускается) return;                 // не даём нажать дважды за возврат
    опускается = true;
    цепочкуНаЭкран(т, false);
    setTimeout(() => {
      опускается = false;
      if (take + 1 < TAKES.length) playTake(take + 1);
      else finale();
    }, 560);
    return;
  }

  if (take + 1 < TAKES.length) playTake(take + 1);
  else finale();
}

/* ── назад ───────────────────────────────────────────────────────────── */
function backward(){
  if (phase === 'idle') return;
  // внутри глобуса шаг назад ведёт по его этапам; с первого он сам попросит
  // вернуть показ к цифрам
  if (phase === 'глобус') return глобусу({ шаг:-1 });
  // назад по финалу не идём: там перемотка ленты. Клавиатура сюда в этих
  // фазах и не пускает, проверка оставлена на случай вызова из кода.
  if (phase === 'финал1' || phase === 'финал2' || phase === 'done') return;
  // поднятая панель — сначала убираем её, такт при этом остаётся на месте
  if (цепочкаПоднята()){ цепочкуНаЭкран(TAKES[take], false); return; }
  // с середины такта — в его начало, с паузы — на такт раньше
  const to = (phase === 'play' && film.currentTime - TAKES[take].from > 0.6)
    ? take : take - 1;
  playTake(Math.max(0, to), { seek:true });
}

/* ── этап тиражирования ───────────────────────────────────────────────
   Последний этап показа — не кадр ленты, а живая сцена three.js: планета,
   подсвеченные области, метки активов. Идёт четвёртым нажатием финала, после
   двойника и цифр. Живёт в своём файле и своём iframe, поднимается заранее
   вместе со слайдом, но тронуться обязан по команде: иначе отъезд от промысла
   отыграет в скрытом кадре и наплыв застанет карту стоящей.

   Клавиатура остаётся одна на весь показ — шаги пробрасываются сообщением, а
   не отдаются фокусу внутри рамки: фокус в iframe теряется от любого клика по
   родителю, и половина нажатий уходила бы в пустоту.
   ──────────────────────────────────────────────────────────────────── */
let глобусГотов = false, глобусЖдётСтарта = false;

function глобусу(что){
  if (globe.contentWindow) globe.contentWindow.postMessage({ глобусу:true, ...что }, '*');
}

function поднятьГлобус(){
  if (!globe.src) globe.src = ГЛОБУС;
}

function показатьГлобус(){
  поднятьГлобус();
  phase = 'глобус';
  effects.classList.remove('on');
  film.classList.remove('влево');
  nudge.classList.remove('on');            // подсказку ведёт сам этап
  globe.classList.add('on');
  $('#tov1').style.display = 'inline-flex';   // уход к модели — по кнопке
  if (глобусГотов) глобусу({ старт:true }); else глобусЖдётСтарта = true;
}

/* Возврат с первого шага этапа — обратно к цифрам, то есть в «финал2»:
   лента снова уходит влево, панель эффектов возвращается. */
function спрятатьГлобус(){
  phase = 'финал2';
  globe.classList.remove('on');
  глобусу({ сброс:true });
  film.classList.add('влево');
  const т = TAKES[TAKES.length - 1];
  if (т.эффекты){ собратьЭффекты(т.эффекты); effects.classList.add('on'); }
  nudge.classList.add('on');
  $('#tov1').style.display = 'none';
}

addEventListener('message', e => {
  const д = e.data;
  if (!д || !д.глобус) return;
  if (д.готов){
    глобусГотов = true;
    if (глобусЖдётСтарта){ глобусЖдётСтарта = false; глобусу({ старт:true }); }
  }
  // с первого этапа глобуса шаг назад возвращает показ к цифрам
  if (д.назад && phase === 'глобус') спрятатьГлобус();
});

/* ── финал ────────────────────────────────────────────────────────────
   Слайд поднялся в скрытом iframe ещё на первом такте и всё это время
   рендерил сцену. Лента остаётся на своём последнем кадре, и мы наплываем
   на живую сцену: ни загрузки, ни вспышки, а наплыв заодно съедает
   остаточную разницу между кадром ленты и рендером.

   Финал больше не конец показа: на нём стоят цифры, а следующий шаг уводит
   на этап тиражирования.
   ──────────────────────────────────────────────────────────────────── */
/* Финал идёт в три нажатия, а не одним куском:
   1) последний кадр стоит по центру — зритель смотрит на собранный двойник;
   2) кадр уходит влево, справа выкатываются эффекты;
   3) панель убирается, остаётся кнопка перехода к 3D-модели.
   Раньше цифры выскакивали вместе с последним кадром и перебивали его. */
function finale(){
  cancelAnimationFrame(raf);
  clearTimeout(boundary);
  phase = 'финал1';
  film.pause();
  fillTicks(TAKES.length);
  cap.classList.remove('on');
  chain.classList.remove('on');
  mark.classList.remove('on');
  film.classList.remove('up');
  effects.classList.remove('on');
  nudge.classList.add('on');            // подсказка: показ ещё не закончен

  const т = TAKES[TAKES.length - 1];
  const конец = т.to - 0.05;
  if (Math.abs(film.currentTime - конец) > 0.2) { try { film.currentTime = конец; } catch(_){} }

  поднятьГлобус();               // на случай прихода сюда пропуском, а не по ленте
  $('#skip').style.display = 'none';
}

function финалДальше(){
  if (phase === 'финал1'){
    phase = 'финал2';
    film.classList.add('влево');
    const т = TAKES[TAKES.length - 1];
    if (т.эффекты){ собратьЭффекты(т.эффекты); effects.classList.add('on'); }
    return;
  }
  if (phase === 'финал2'){
    // Цифрами показ больше не заканчивается: следующим нажатием выкатывается
    // этап тиражирования, а к модели докладчик уходит кнопкой в любой момент.
    показатьГлобус();
  }
}

/* ── управление ──────────────────────────────────────────────────────── */
$('#skip').addEventListener('click', e => { e.stopPropagation(); finale(); });
// «Демо показа v1» уводит на сам слайд, а не разворачивает его внутри показа
$('#tov1').addEventListener('click', e => e.stopPropagation());

addEventListener('keydown', e => {
  if (phase === 'idle' || phase === 'done') return;
  if (phase === 'финал1' || phase === 'финал2'){
    const c = e.code;
    if (c === 'ArrowRight' || c === 'Enter' || c === 'Space'){ e.preventDefault(); финалДальше(); }
    return;
  }
  // фаза «глобус» идёт общим путём: шаги внутри неё разбирает forward/backward
  const c = e.code;
  if (c === 'ArrowRight' || c === 'Enter' || c === 'NumpadEnter' ||
      c === 'Space' || c === 'PageDown'){ e.preventDefault(); forward(); }
  if (c === 'ArrowLeft' || c === 'Backspace' || c === 'PageUp'){ e.preventDefault(); backward(); }
  if (c === 'Escape' && phase !== 'глобус') finale();
  if (c === 'KeyF'){
    document.fullscreenElement ? document.exitFullscreen()
                               : document.documentElement.requestFullscreen();
  }
});

/* Клик по родителю ведёт показ до финала включительно. Внутри этапа
   тиражирования клики ловит он сам — до родителя они не доходят, и
   пробрасывать их незачем. */
addEventListener('click', () => {
  if (phase === 'play' || phase === 'hold' || phase === 'финал1' || phase === 'финал2') forward();
});

/* ── старт ───────────────────────────────────────────────────────────── */
const load = $('#load');
const ready = () => film.readyState >= 3;

film.addEventListener('progress', () => {
  if (!ready() && film.buffered.length){
    const got = film.buffered.end(film.buffered.length - 1);
    load.textContent = 'лента готова на ' + Math.round(got / (film.duration || 49) * 100) + '%';
  } else if (ready()) load.textContent = '';
});

/* Слайд поднимаем сразу, не дожидаясь начала показа: 26 МБ моделей и их
   выгрузка на видеокарту — самая тяжёлая часть, и она должна пройти пока
   докладчик читает вступление, а не под уже играющей лентой. Дальше слайд
   спит в редком рендере до финала. */
slide.src = SLIDE;

// служебный хук: даёт прогнать финал без ожидания ленты
window.__demo = { finale, финалДальше, forward, playTake, TAKES, get фаза(){ return phase; } };

/* Показ не должен стартовать на недогруженной ленте: первый такт дёрнется или
   не тронется вовсе. Если данных мало — кнопка честно говорит, что ждём, и
   стартует сама, как только их хватит. */
function начать(){
  if (phase !== 'idle') return;        // оба сторожа готовности могут сработать
  const заставка = $('#start');
  заставка.classList.add('gone');
  // страховка: если переход по opacity не отработает, экран всё равно уберётся
  setTimeout(() => { заставка.style.display = 'none'; }, 700);
  playTake(0, { seek:true });
}

/* Показ открывается сразу лентой: заставки с кнопкой «начать» больше нет —
   на неё уходит время докладчика, а приходят сюда уже с модели, осознанно.
   Пока данных не хватает, на экране остаётся только строка ожидания. */
$('#load').textContent = 'готовим ленту…';
if (film.readyState >= 3) начать();
else {
  film.addEventListener('canplaythrough', начать, { once:true });
  film.addEventListener('canplay', () => setTimeout(начать, 400), { once:true });
}
</script>
</body>
</html>
