<title>Показ с пилота · Восточный Молдабек</title>

<!-- Короткий отрезок показа: с выбранного промысла и до конца — спуск к
     объектам, блок двойника, цифры, этап тиражирования. Подлёт от области к
     месторождению в отрезок не входит, поэтому берётся не начало такта
     «Пилот проекта», а следующий: показ открывается кадром с контуром
     Восточного Молдабека, подпись при этом наследуется от предыдущего такта.

     Страница ничего не показывает сама, а открывает тот же demo_with_map.html
     с параметром `?такт=3`: копия показа с урезанным списком тактов разошлась
     бы с оригиналом на первой же правке.

     Кириллица в адресе кодируется посегментно — иначе часть браузеров уносит
     запрос не туда, а на GitHub Pages страница не поднимается вовсе.
     `replace`, а не переход: иначе «назад» из показа возвращало бы сюда, а
     отсюда снова в показ — и кнопка становилась бы ловушкой. -->
<script>location.replace('demo_with_map.html?%D1%82%D0%B0%D0%BA%D1%82=3');</script>
