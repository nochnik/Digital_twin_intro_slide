<!-- Короткий отрезок показа: с пилотного актива и до конца — спуск к объектам,
     блок двойника, цифры, этап тиражирования. Начинается ровно там, где по
     сценарию МЭПМ Председатель передаёт слово генеральному директору ЭМГ:
     с такта «Пилот проекта», который несёт первую строку его речи.

     Раньше отрезок брал следующий такт, чтобы не показывать подлёт от области
     к месторождению. Теперь этого делать нельзя: с того такта начинается уже
     второй абзац речи, и первый оказался бы пропущен.

     Страница ничего не показывает сама, а открывает тот же demo_with_map.html
     с параметром `?такт=2`: копия показа с урезанным списком тактов разошлась
     бы с оригиналом на первой же правке.

     Кириллица в адресе кодируется посегментно — иначе часть браузеров уносит
     запрос не туда, а на GitHub Pages страница не поднимается вовсе.
     `replace`, а не переход: иначе «назад» из показа возвращало бы сюда, а
     отсюда снова в показ — и кнопка становилась бы ловушкой. -->
