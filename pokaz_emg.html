<!-- Часть «Эмбамунайгаз» отдельной ссылкой: контур Восточного Молдабека →
     справка «Пилотный актив» → разбор цепочки по переделам → «Ожидаемые
     эффекты по контурам». Вводная часть Председателя правления и этап
     тиражирования в неё не входят: и то и другое — его слово, а не ЭМГ.

     Страница ничего не показывает сама, а открывает тот же demo_with_map.html
     с двумя параметрами: `такт=3` — начать там, где Председатель передал
     слово, `тиражирование=0` — закончить на эффектах. Копия показа с урезанным
     списком тактов разошлась бы с оригиналом на первой же правке; здесь
     расходиться нечему.

     Имя файла латиницей, в отличие от соседей: ссылку на эту страницу
     пересылают в переписке, а кириллический адрес по дороге превращается в
     череду процентов — его нельзя ни прочитать, ни продиктовать.

     Кириллица в самих параметрах кодируется посегментно — иначе часть
     браузеров уносит запрос не туда, а на GitHub Pages страница не поднимается.
     `replace`, а не переход: иначе «назад» из показа возвращало бы сюда, а
     отсюда снова в показ — и кнопка становилась бы ловушкой. -->
